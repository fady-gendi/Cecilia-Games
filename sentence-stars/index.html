<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sentence Stars">
<meta name="format-detection" content="telephone=no">
<title>Sentence Stars</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#d9f2ff;color:#2b3a55;
 font-family:"Arial Rounded MT Bold","Trebuchet MS","Geeza Pro","Noto Naskh Arabic","Noto Sans Arabic","Segoe UI",Arial,sans-serif;
 -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{position:fixed;top:env(safe-area-inset-top);left:env(safe-area-inset-left);right:env(safe-area-inset-right);bottom:env(safe-area-inset-bottom);
 background:-webkit-linear-gradient(top,#e7e1ff 0%,#fbefff 55%,#ffe6f1 100%);background:linear-gradient(to bottom,#e7e1ff 0%,#fbefff 55%,#ffe6f1 100%)}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;-webkit-flex-direction:column;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px}
.screen.on{display:-webkit-flex;display:flex}
.bar{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;-webkit-flex-wrap:wrap;flex-wrap:wrap;margin-bottom:8px}
.bar .sp{-webkit-flex:1;flex:1}
.pill{background:#fff;border-radius:999px;padding:8px 14px;font-size:20px;font-weight:bold;margin:3px;box-shadow:0 2px 0 rgba(0,0,0,.08);white-space:nowrap}
.btn{min-height:52px;min-width:52px;border:0;border-radius:18px;padding:10px 20px;font:inherit;font-size:20px;font-weight:bold;color:#fff;background:#ff8a5c;
 box-shadow:0 5px 0 rgba(0,0,0,.18);margin:5px;cursor:pointer;touch-action:manipulation;-webkit-transition:-webkit-transform .08s;transition:transform .08s}
.btn:active{-webkit-transform:translateY(3px) scale(.97);transform:translateY(3px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.btn.blue{background:#4f8cff}.btn.green{background:#3cb371}.btn.pink{background:#ff6fa8}.btn.gray{background:#9aa5b8}.btn.gold{background:#f5b800;color:#4a3500}
.btn[disabled]{opacity:.45}
h1{margin:6px 0;font-size:34px;text-align:center}
.langs{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;margin:6px 0}
.lcard{width:280px;margin:10px;background:#fff;border-radius:26px;padding:24px 18px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.1);touch-action:manipulation;cursor:pointer}
.lcard:active{-webkit-transform:scale(.97);transform:scale(.97)}
.lcard .flag{font-size:72px}.lcard .nm{font-size:32px;font-weight:bold;margin:2px 0}.lcard .lv{font-size:22px;color:#5b6b88}
#s-home{-webkit-justify-content:center;justify-content:center}
.prog{height:20px;border-radius:12px;background:#e6edf7;overflow:hidden;margin:10px 4px 4px}
.prog i{display:block;height:100%;background:#3cb371;border-radius:12px;-webkit-transition:width .4s;transition:width .4s}
.lcard.lock{background:#eef0f4;opacity:.92}.lcard .lk{font-size:16px;color:#c0392b;margin-top:6px;min-height:20px}
.row{display:-webkit-flex;display:flex;-webkit-justify-content:center;justify-content:center;-webkit-flex-wrap:wrap;flex-wrap:wrap}
#gmain{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-flex:1;flex:1;min-height:0}
#gleft,#gright{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center}
#gleft{-webkit-flex:0 0 auto;flex:0 0 auto}#gright{-webkit-flex:1;flex:1;-webkit-justify-content:center;justify-content:center}
@media (orientation:landscape) and (min-width:700px){#gmain{-webkit-flex-direction:row;flex-direction:row}#gleft{width:36%;-webkit-justify-content:center;justify-content:center}}
#tabs{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.tab{margin:3px;padding:8px 14px;border-radius:14px;background:#fff;font-size:22px;font-weight:bold;touch-action:manipulation;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.1)}
.tab.on{background:#ffd54f}.tab.lk{opacity:.5}
#page{background:#fff8e6;border:4px dashed #e2c98b;border-radius:26px;padding:12px;margin:8px auto;max-width:640px;width:100%}
#page h2{margin:4px 0 10px;text-align:center;font-size:26px}
.slots{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.slot{width:130px;height:130px;margin:6px;border-radius:22px;background:#fffdf5;border:3px dashed #d9c58c;text-align:center;position:relative;touch-action:manipulation;cursor:pointer;overflow:hidden}
.slot .em{font-size:68px;line-height:100px}
.slot.empty .em{-webkit-filter:grayscale(1) brightness(.55) contrast(.6);filter:grayscale(1) brightness(.55) contrast(.6);opacity:.35}
.slot .pr{position:absolute;left:0;right:0;bottom:6px;font-size:18px;font-weight:bold;color:#7a5b00}
.slot.own{border-style:solid;border-color:#f5b800;background:#fff}
.slot.pop .em{-webkit-animation:pop .6s;animation:pop .6s}
@-webkit-keyframes pop{0%{-webkit-transform:scale(.2) rotate(-30deg)}60%{-webkit-transform:scale(1.4) rotate(10deg)}100%{-webkit-transform:scale(1)}}
@keyframes pop{0%{transform:scale(.2) rotate(-30deg)}60%{transform:scale(1.4) rotate(10deg)}100%{transform:scale(1)}}
#tgrid{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center}
.tcard{width:150px;margin:7px;background:#fff;border-radius:22px;padding:10px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.1);touch-action:manipulation;cursor:pointer}
.tcard .em{font-size:52px}.tcard .tt{font-size:15px;font-weight:bold;min-height:38px}
.tcard.off{opacity:.45;background:#eceff4}.tcard.off .em{-webkit-filter:grayscale(1);filter:grayscale(1)}
#modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(20,30,60,.55);display:none;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;z-index:50;padding:14px}
#modal.on{display:-webkit-flex;display:flex}
.mcard{background:#fff;border-radius:28px;padding:18px;max-width:560px;width:100%;max-height:96%;overflow-y:auto;text-align:center;-webkit-animation:rise .3s;animation:rise .3s}
@-webkit-keyframes rise{from{-webkit-transform:translateY(40px) scale(.9);opacity:0}}
@keyframes rise{from{transform:translateY(40px) scale(.9);opacity:0}}
.mcard .big{font-size:84px;line-height:1.1}.mcard h2{margin:6px 0;font-size:28px}.mcard p{font-size:20px;margin:6px 0}
.mcard img.trophyimg{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;pointer-events:auto}
.mcard img{width:100%;max-width:420px;border-radius:18px;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.mcard textarea{-webkit-user-select:text;user-select:text}
.mcard input,.mcard select{font:inherit;font-size:20px;padding:10px;border-radius:12px;border:2px solid #b8c4d8;margin:4px;width:90%;max-width:360px;-webkit-user-select:text;user-select:text}
.mcard .lab{text-align:left;font-size:16px;margin:8px 8% 0;color:#5b6b88}
a.btn{display:inline-block;text-decoration:none}
#toast{position:fixed;left:50%;top:14%;-webkit-transform:translateX(-50%);transform:translateX(-50%);background:#2b3a55;color:#fff;padding:12px 22px;border-radius:999px;font-size:20px;font-weight:bold;z-index:80;opacity:0;pointer-events:none;-webkit-transition:opacity .25s;transition:opacity .25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#fx{position:fixed;top:0;left:0;right:0;bottom:0;pointer-events:none;z-index:70;overflow:hidden}
.fxp{position:absolute;font-size:34px;-webkit-animation:fall 1.6s ease-in forwards;animation:fall 1.6s ease-in forwards}
@-webkit-keyframes fall{from{opacity:1}to{-webkit-transform:translateY(110vh) rotate(360deg);opacity:.9}}
@keyframes fall{from{opacity:1}to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
.shake{-webkit-animation:shake .35s;animation:shake .35s}
@-webkit-keyframes shake{25%{-webkit-transform:translateX(-8px)}75%{-webkit-transform:translateX(8px)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
#hot{position:fixed;right:0;bottom:0;width:70px;height:70px;z-index:40;background:transparent}
.gear{font-size:14px;color:#5b6b88}
.pet{-webkit-animation:pop .6s;animation:pop .6s}
#ssmain{-webkit-flex:1;flex:1;display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;-webkit-justify-content:center;justify-content:center;width:100%;max-width:940px;margin:0 auto}
#lives{font-size:30px;margin:2px 0 4px;letter-spacing:4px}
#sentCard{background:#fff;border-radius:30px;padding:18px 24px;box-shadow:0 6px 0 rgba(60,40,110,.10);text-align:center;width:100%;max-width:860px;margin:4px 0 8px}
#hintPic{font-size:84px;line-height:1.1}
#sentence{font-size:40px;font-weight:bold;color:#2f2763;line-height:1.4}
#sentence.rtl{font-size:46px}
.blank{display:inline-block;min-width:120px;border-bottom:6px dashed #a78bfa;color:#a78bfa;margin:0 8px;line-height:1.1}
.fill{display:inline-block;color:#24985a;border-bottom:6px solid #24985a;padding:0 8px;line-height:1.1}
#mean{font-size:20px;color:#6b6f8a;min-height:26px;margin-top:6px}
#msg{min-height:28px;font-size:22px;font-weight:bold;text-align:center;margin:2px 0}
#choices{display:-webkit-flex;display:flex;-webkit-flex-wrap:wrap;flex-wrap:wrap;-webkit-justify-content:center;justify-content:center;max-width:940px}
.ch{margin:7px;border:0;background:#fff;border-radius:24px;box-shadow:0 6px 0 rgba(60,40,110,.16);font:inherit;color:#2f2763;touch-action:manipulation;cursor:pointer;padding:0;-webkit-transition:-webkit-transform .08s;transition:transform .08s}
.ch.pic{width:136px;height:136px;font-size:80px;line-height:136px}
.ch.word{min-width:150px;min-height:76px;padding:10px 24px;font-size:32px;font-weight:bold}
.ch:active{-webkit-transform:translateY(3px);transform:translateY(3px);box-shadow:0 2px 0 rgba(60,40,110,.16)}
.ch.bad{background:#e9e7f1;opacity:.45;text-decoration:line-through}
.ch.gone{visibility:hidden}
.ch.good{background:#7ddc8c;color:#fff;-webkit-animation:pop .5s;animation:pop .5s}
.ch[disabled]{pointer-events:none}
#choices.rtl{direction:rtl}
@media (max-width:620px){.ch.pic{width:98px;height:98px;font-size:58px;line-height:98px}.ch.word{min-width:118px;min-height:62px;font-size:24px}#sentence{font-size:28px}#sentence.rtl{font-size:32px}#hintPic{font-size:60px}}

</style>
</head>

function slim(o){
 var t={},k,tr={};
 for(k in o){if(k==='used'||k==='hard'||k==='custom'||k==='tro'){continue;}t[k]=o[k];}
 for(k in o.tro){tr[k]=1;}
 t.tro=tr;t.slim=1;return t;
}

}

}
function newer(a,b){
 if(a&&typeof a!=='object'){a=null;}
 if(b&&typeof b!=='object'){b=null;}
 if(a&&b){return (b.ts||0)>(a.ts||0)?b:a;}
 return a||b;
}

/* IndexedDB copy (asynchronous) */
function idbOpen(cb){
 try{
  var r=indexedDB.open(GAME.idb,1);
  r.onupgradeneeded=function(){r.result.createObjectStore('kv');};
  r.onsuccess=function(){cb(r.result);};
  r.onerror=function(){cb(null);};
 }catch(e){cb(null);}
}
function idbPut(j){idbOpen(function(db){if(!db){return;}try{db.transaction('kv','readwrite').objectStore('kv').put(j,'state');}catch(e){}});}
function idbGet(cb){
 idbOpen(function(db){
  if(!db){cb(null);return;}
  try{var q=db.transaction('kv','readonly').objectStore('kv').get('state');q.onsuccess=function(){cb(q.result||null);};q.onerror=function(){cb(null);};}catch(e){cb(null);}
 });
}
function mergeState(s){
 var d=defState(),k,j;
 if(!s||typeof s!=='object'){return d;}
 for(k in d){
  if(s[k]===undefined||s[k]===null){continue;}
  if(d[k]!==null&&typeof d[k]==='object'&&!(d[k] instanceof Array)){for(j in s[k]){d[k][j]=s[k][j];}}
  else{d[k]=s[k];}
 }
 return d;
}

/* ----- scoring ----- */
function winWord(lang,misses,hints){
 var r={coins:10,notes:[],leveled:false},bonus;
 if(misses===0&&hints===0){r.coins+=5;r.notes.push('Perfect +5');}
 S.total++;S.streak++;if(S.streak>S.best){S.best=S.streak;}
 if(S.streak%5===0){r.coins+=10;r.notes.push(S.streak+' in a row +10');}
 S.solved[lang]++;
 if(S.solved[lang]>=S.target[lang]){
  r.leveled=true;r.oldLevel=S.lv[lang];
  if(S.clean[lang]){S.cleanRun++;if(S.cleanRun>S.cleanBest){S.cleanBest=S.cleanRun;}bonus=20;r.notes.push('Perfect level +20');r.perfect=true;}
  else{S.cleanRun=0;bonus=0;}
  S.lv[lang]=Math.min(S.lv[lang]+1,MAXL+1);
  S.solved[lang]=0;S.target[lang]=rnd(10,15);S.clean[lang]=true;
  S.stars++;r.coins+=30+bonus;r.notes.push('Level up +30');
  r.newLevel=S.lv[lang];
 }
 S.coins+=r.coins;save();
 r.ach=checkAch();
 return r;
}
function loseWord(lang){S.streak=0;S.clean[lang]=false;save();}
function buySticker(pi,slot){
 var P=PAGES[pi],id=pi+'_'+slot;
 if(S.owned[id]){return 'owned';}
 if(S.total<P.need){return 'locked';}
 if(S.coins<P.price){return 'poor';}
 S.coins-=P.price;S.owned[id]=1;
 var bonus=false;
 if(pageDone(pi)){S.coins+=50;bonus=true;}
 save();
 return bonus?'page':'ok';
}

  ctx.fillText(deco[i%deco.length],x,y);
 }
 ctx.globalAlpha=1;
 ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;
 ctx.fillStyle='#ffffff';ctx.beginPath();
 if(ctx.roundRect){ctx.roundRect(100,70,880,930,70);}else{ctx.rect(100,70,880,930);}
 ctx.fill();
 ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.fillStyle='#5b6b88';ctx.font='bold 42px '+TX;ctx.fillText(GAME.icon+' '+GAME.title+' '+GAME.icon,540,135);
 /* avatar circle: her face (or the trophy emoji when there is no photo) */
 ctx.fillStyle=a.c2;ctx.beginPath();ctx.arc(540,360,192,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(540,360,176,0,Math.PI*2);ctx.clip();
 if(face){ctx.drawImage(face,364,184,352,352);}
 else{ctx.fillStyle=a.c1;ctx.fillRect(364,184,352,352);ctx.fillStyle='#000';ctx.font='230px '+EM;ctx.fillText(a.e,540,372);}
 ctx.restore();
 if(face){ /* trophy badge */
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(705,510,70,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=a.c2;ctx.lineWidth=10;ctx.stroke();
  ctx.fillStyle='#000';ctx.font='84px '+EM;ctx.fillText(a.e,705,517);
 }
 ctx.fillStyle='#1d2b4a';ctx.font='bold 68px '+TX;
 var lines=wrapText(ctx,a.t,780),ty=650;
 for(i=0;i<lines.length;i++){ctx.fillText(lines[i],540,ty+i*78);}
 var sy=ty+(lines.length-1)*78+64;
 ctx.fillStyle='#4a5a78';ctx.font='38px '+TX;ctx.fillText(a.s,540,sy);
 if(nm){
  var fs=88;ctx.font='bold '+fs+'px '+TX;
  while(ctx.measureText('★ '+nm+' ★').width>780&&fs>40){fs-=4;ctx.font='bold '+fs+'px '+TX;}
  ctx.fillStyle=a.c2;ctx.fillText('★ '+nm+' ★',540,sy+84);
 }
 if(isPage){
  var P=PAGES[parseInt(id.substring(4),10)];ctx.font='58px '+EM;ctx.fillStyle='#000';
  for(i=0;i<8;i++){ctx.fillText(P.items[i],215+i*93,948);}
 }
 if(!isPage){ctx.font='64px '+EM;ctx.fillStyle='#000';ctx.fillText('⭐ 🌟 ⭐',540,930);}
 var d=new Date(S.tro[id]||Date.now());
 ctx.fillStyle='#ffffff';ctx.font='bold 38px '+TX;
 ctx.fillText(d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),540,1040);
 return c.toDataURL('image/png');
}
/* ----- parent area ----- */
var hotN=0,hotT=null;
function parentLogin(){
 showModal('<h2>🔐 Parent area</h2><input id="pu" type="text" placeholder="User name" autocapitalize="none" autocorrect="off"><br><input id="pp" type="password" placeholder="Password"><br><button class="btn green" onclick="parentCheck()">Enter</button><button class="btn gray" onclick="closeModal()">Close</button>');
}
function parentCheck(){
 var u=$('pu').value.trim().toLowerCase(),p=$('pp').value;
 if(hashStr(u+'|'+p)===GATE){closeModal();parentPanel();}else{toast('Wrong user name or password');}
}
function opts(a,b,sel){var s='',i;for(i=a;i<=b;i++){s+='<option value="'+i+'"'+(i===sel?' selected':'')+'>'+i+'</option>';}return s;}
function parentPanel(){
 var h='<h2>👨‍👧 Parent area</h2><p style="font-size:13px;color:#7b8aa5">'+GAME.title+' · version '+APP_VERSION+'</p><p style="font-size:17px">'+GAME.t.solved+': <b>'+S.total+'</b> · Coins: <b>'+S.coins+'</b> · Stars: <b>'+S.stars+'</b> · Best streak: <b>'+S.best+'</b></p>';
 h+='<div class="lab">Add coins</div><button class="btn blue" onclick="pAdd(50)">+50 🪙</button><button class="btn blue" onclick="pAdd(500)">+500 🪙</button>';
 h+='<div class="lab">Set levels (1-6, where 6 = Master)</div>';
 LANGS.forEach(function(L){h+='<div>'+L.flag+' '+L.en+' <select id="pl_'+L.id+'" style="width:90px">'+opts(1,6,S.lv[L.id])+'</select></div>';});
 h+='<button class="btn green" onclick="pLevels()">Apply levels</button>';
 h+='<div class="lab">Name on trophy pictures (optional)</div><input id="pn" type="text" value="'+S.name.replace(/"/g,'')+'" maxlength="20"><br><button class="btn green" onclick="pName()">Save name</button>';
 if(GAME.custom){
 h+='<div class="lab">Add your own word</div><select id="cw_l"><option value="en">English</option><option value="fr">French</option><option value="ar">Arabic</option></select><select id="cw_v">'+opts(1,5,1)+'</select>';
 h+='<input id="cw_e" type="text" placeholder="Emoji, e.g. 🐱" maxlength="8"><input id="cw_w" type="text" placeholder="Word (letters only)" maxlength="12" autocapitalize="none" autocorrect="off"><input id="cw_m" type="text" placeholder="English meaning (optional)" maxlength="30"><br><button class="btn green" onclick="pWord()">Add word</button>';
 if(S.custom.length){
  h+='<div class="lab">Your words (tap ✖ to remove)</div><div>';
  S.custom.forEach(function(c,i){h+='<span class="pill" style="font-size:16px;display:inline-block">'+c.e+' '+c.w+' ('+c.lang+' L'+c.lvl+') <span onclick="pDel('+i+')" style="color:#c0392b;padding:6px">✖</span></span>';});
  h+='</div>';
 }
 }
 h+='<div class="lab">Progress saving</div><p style="font-size:16px;margin:4px 8%">'+(storageOK()?'✅ This browser saves progress on this device.':'⚠️ This view cannot save permanently. Open the game link in Safari (not a preview) and use Add to Home Screen.')+'</p>';
 h+='<div class="lab">Backup code (copy it somewhere safe, or paste one here to restore)</div><textarea id="pcode" rows="4" style="width:90%;max-width:360px;font-size:14px;border-radius:12px;border:2px solid #b8c4d8;padding:8px"></textarea><br><button class="btn blue" onclick="pMake()">Make code</button><button class="btn blue" onclick="pRestore()">Restore from code</button>';
 h+='<div class="lab">☁️ Cloud save (Google Sheet)</div><p style="font-size:16px;margin:4px 8%">'+(cloudOn()?(cloud.state==='ok'?'✅ Connected. Last cloud save: '+(cloud.lastOk?new Date(cloud.lastOk).toLocaleTimeString():'—'):'⚠️ Not reachable right now ('+cloud.state+'). Progress is kept on this iPad and sent when back online.'):'Not set up yet.')+'</p>'+(cloudOn()?'<button class="btn blue" onclick="cloudPush(true);toast(\'Saving to cloud…\')">Save to cloud now</button><button class="btn blue" onclick="pCloudLoad()">Load from cloud</button>':'');
 h+='<div class="lab">💾 Save file</div><button class="btn green" onclick="pFileMake()">Make save file</button><div id="pfileLink" style="margin:4px 0"></div>';
 h+='<div class="lab">📂 Load a save file</div><input id="pfile" type="file" accept=".json,application/json,text/plain" onchange="pFileLoad(this)" style="font-size:16px">';
 h+='<div class="lab">Danger zone</div><button class="btn pink" id="pReset" onclick="pReset()">Reset ALL progress</button><br><button class="btn gray" onclick="closeModal();renderHome()">Close</button>';
 showModal(h);
}
function pAdd(n){S.coins+=n;save();toast('+'+n+' coins');closeModal();parentPanel();}
function pLevels(){
 LANGS.forEach(function(L){
  var v=parseInt($('pl_'+L.id).value,10);
  if(v!==S.lv[L.id]){S.lv[L.id]=v;S.solved[L.id]=0;S.target[L.id]=rnd(10,15);S.clean[L.id]=true;}
 });
 save();checkAch();toast('Levels updated');closeModal();parentPanel();
}
function pName(){PICS={};S.name=$('pn').value.trim().replace(/[<>"&]/g,'');save();toast('Saved');}
function pWord(){
 var l=$('cw_l').value,v=parseInt($('cw_v').value,10),e=$('cw_e').value.trim(),w=$('cw_w').value.trim(),m=$('cw_m').value.trim().replace(/[<>"&]/g,'');
 if(!e){toast('Add an emoji picture');return;}
 if(!validWord(l,w)){toast('Word must be 2-12 letters of that language');return;}
 S.custom.push({lang:l,lvl:v,e:e,w:w,m:m});save();toast('Word added ✅');closeModal();parentPanel();
}
function pDel(i){S.custom.splice(i,1);save();closeModal();parentPanel();}
function pMake(){var t=$('pcode');t.value=makeCode();try{t.focus();t.select();}catch(e){}toast('Code ready — copy it');}
function pRestore(){
 var o=readCode($('pcode').value);
 if(!o){toast('That code is not valid');return;}
 S=mergeState(o);save();cloudPush(true);toast('Progress restored ✅');closeModal();renderHome();
}
function saveFileName(){var d=new Date();function z(n){return (n<10?'0':'')+n;}return GAME.slug+'-save-'+d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'.json';}
function pFileMake(){
 var txt=JSON.stringify({app:GAME.app,v:1,saved:new Date().toISOString(),code:makeCode()}),url,box=$('pfileLink'),nm=saveFileName();
 try{url=URL.createObjectURL(new Blob([txt],{type:'application/json'}));}catch(e){url='data:application/json;charset=utf-8,'+encodeURIComponent(txt);}
 box.innerHTML='<a class="btn blue" id="pfileA" href="'+url+'" download="'+nm+'">⬇️ Download '+nm+'</a><p style="font-size:15px;margin:4px 8%">On iPad: tap it, then choose Download. The file goes to Files › Downloads.</p>';
}
function pFileLoad(inp){
 var f=inp.files&&inp.files[0];
 if(!f){return;}
 var r=new FileReader();
 r.onload=function(){
  var t=String(r.result||''),o=null,j;
  try{j=JSON.parse(t);if(j&&j.app===GAME.app&&j.code){o=readCode(j.code);}}catch(e){o=readCode(t);}
  if(!o){toast('That is not a '+GAME.title+' save file');inp.value='';return;}
  S=mergeState(o);save();cloudPush(true);toast('Progress loaded ✅');closeModal();renderHome();
 };
 r.onerror=function(){toast('Could not read that file');};
 r.readAsText(f);
}
function pCloudLoad(){
 cloudLoad(function(cs){
  if(!cs){toast('Nothing in the cloud yet, or it is not reachable');return;}
  S=mergeState(cs);saveLocal();toast('Loaded from the cloud ✅');closeModal();renderHome();
 });
}
function pReset(){
 var b=$('pReset');
 if(b.getAttribute('data-c')!=='1'){b.setAttribute('data-c','1');b.textContent='Tap again to erase everything';return;}
 S=defState();save();cloudPush(true);toast('Progress reset');closeModal();renderHome();
}
function hotTap(){
 hotN++;clearTimeout(hotT);hotT=setTimeout(function(){hotN=0;},2500);
 if(hotN>=5){hotN=0;parentLogin();}
}
/* ----- init ----- */
function init(){
 $('langs').addEventListener('click',function(e){var n=e.target;while(n&&n!==this&&!n.getAttribute('data-l')){n=n.parentNode;}if(n&&n.getAttribute&&n.getAttribute('data-l')){startLang(n.getAttribute('data-l'));}});
 gameInit();
 $('bBook').addEventListener('click',function(){go('book');});
 $('bTroph').addEventListener('click',function(){go('trophy');});
 $('gBack').addEventListener('click',function(){go('home');});
 $('bkBack').addEventListener('click',function(){go('home');});
 $('trBack').addEventListener('click',function(){go('home');});
 $('tabs').addEventListener('click',function(e){var p=e.target.getAttribute&&e.target.getAttribute('data-p');if(p!==null&&p!==undefined&&p!==false){bkPage=parseInt(p,10);renderBook();}});
 $('page').addEventListener('click',function(e){var n=e.target;while(n&&n!==this&&!(n.getAttribute&&n.getAttribute('data-s')!==null)){n=n.parentNode;}if(n&&n!==this&&n.getAttribute('data-s')!==null){onSlot(parseInt(n.getAttribute('data-s'),10));}});
 $('tgrid').addEventListener('click',function(e){
  var n=e.target;while(n&&n!==this&&!(n.getAttribute&&n.getAttribute('data-a'))){n=n.parentNode;}
  if(n&&n!==this){var id=n.getAttribute('data-a');
   if(S.tro[id]){showModal(trophyHtml(id,'🏆 '+achById(id).t));}
   else{toast('Keep playing to win this one: '+achById(id).t);}}
 });
 $('hot').addEventListener('click',hotTap);
 $('bParent').addEventListener('click',parentLogin);
 try{if(navigator.storage&&navigator.storage.persist){document.addEventListener('click',function ask(){document.removeEventListener('click',ask);navigator.storage.persist();});}}catch(e){}
 preloadFaces();
 document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden'){flushSave();}});
 window.addEventListener('pagehide',flushSave);
 window.addEventListener('beforeunload',flushSave);
 renderHome();cloudStatus(cloudOn()?'saving':'off');
 bootRestore(function(){
  renderHome();
  if(S.inGame&&S.round&&S.round.lang&&!isLocked(S.round.lang)){startLang(S.round.lang);}
 });
}
init();
</script>
