<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#ffe8f3">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<title>My Coins</title>
<link rel="stylesheet" href="../shared/cecilia.css?v=32">
<style>
/* Cecilia's coin page: how many coins, where they come from, where to spend them. */
*{box-sizing:border-box}
.wrap{max-width:820px;margin:0 auto;padding:16px 16px 40px;text-align:center}
.bal{padding:20px;margin:6px 0 16px}
.bal b{display:block;font-size:64px;color:#7a5200}
.bal p{font-size:22px;margin:4px 0;color:#6d5a85}
h2{font-size:28px;margin:22px 0 8px;color:#805996}
.rules{text-align:left;padding:14px 20px;font-size:22px;line-height:1.6}
.hist{text-align:left;padding:8px 16px}
.row{display:-webkit-box;display:-webkit-flex;display:flex;-webkit-box-align:center;-webkit-align-items:center;align-items:center;border-bottom:2px dashed #f0e6f7;padding:10px 4px;font-size:19px}
.row:last-child{border:0}
.row span{-webkit-box-flex:1;-webkit-flex:1;flex:1}
.row b{font-size:22px;white-space:nowrap}
.plus{color:#2e9e5b}.minus{color:#b04a7a}
.note{font-size:16px;color:#9a8db0;margin-top:10px}
</style>
</head>
<body class="cg-page" data-cg-title="My Coins">
<div class="wrap">
 <div class="bal cg-card"><b><span id="balance">0</span> <i class="cg-c"></i></b><p>One coin box for all my games</p></div>
 <a class="cg-btn cg-pink cg-wide" id="spend" href="../rainbow-kingdom/">🌈 Spend coins in Rainbow Kingdom</a>
 <h2>📚 Earn coins</h2>
 <div class="cg-cards" id="earn"></div>
 <div class="rules cg-card" id="rules"></div>
 <h2>📜 My coin story</h2>
 <div class="hist cg-card" id="history"></div>
 <p class="note" id="status"></p>
</div>
<script src="../shared/cecilia.js?v=32"></script>
<script>
(function(){'use strict';
var W=CeciliaWallet,G=CeciliaGames,UI=CeciliaUI,C=UI.coin,R=G.coins,esc=UI.esc;
var h='';G.learn().forEach(function(g){h+='<a class="cg-gcard" style="background:'+g.bg+'" href="'+G.url(g)+'"><span class="cg-gi">'+g.icon+'</span><b>'+esc(g.title)+'</b><small>Earn '+C+'</small></a>'});
document.getElementById('earn').innerHTML=h;
document.getElementById('rules').innerHTML='✅ Right answer: <b>+'+R.correct+'</b> '+C+'<br>🌟 No mistakes: <b>+'+R.perfect+'</b> more<br>🔥 5 in a row: <b>+'+R.streak5+'</b><br>🏆 New level: <b>+'+R.level+'</b>';
function name(src){if(src==='parent')return '👪 Gift';var g=G.get(src);return g?g.icon+' '+g.title:src}
function render(){
 document.getElementById('balance').textContent=W.balance();document.getElementById('status').textContent=W.status();
 var list=W.records().slice(0,40),out='';
 list.forEach(function(e){var d=e.status==='rejected'?0:e.delta;
  out+='<div class="row"><span>'+name(e.source)+' · '+esc(e.reason||'')+(e.status==='rejected'?' · returned':'')+'</span><b class="'+(d>=0?'plus':'minus')+'">'+(d>=0?'+':'')+d+' '+C+'</b></div>'});
 document.getElementById('history').innerHTML=out||'<div class="row"><span>Play a learning game to earn your first coins!</span></div>';
}
W.onChange(render);
})();
</script>
</body>
</html>
