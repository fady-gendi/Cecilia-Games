<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffe9f2"><title>Cecilia’s Account</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#ffe6f1,#eee7ff,#def5ff);font-family:'Trebuchet MS',Arial,sans-serif;color:#5c426d;min-height:100vh}main{max-width:950px;margin:auto;padding:22px 18px 75px}a{color:inherit;text-decoration:none}h1{text-align:center;font-size:36px;margin:12px 0}.balance{background:#fffaf0;border:4px solid white;border-radius:30px;text-align:center;padding:24px;margin:20px auto;max-width:520px;box-shadow:0 7px 0 #dac4de}.balance b{font-size:62px;display:block;color:#a97923}.balance p{font-size:21px;margin:10px 0 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:15px}.card{background:#fff9fe;border:3px solid white;border-radius:26px;padding:20px;text-align:center;font-size:22px;font-weight:bold;box-shadow:0 5px 0 #dac9e4}.card span{display:block;font-size:52px;margin:6px}.play{background:#ead6ec;font-size:26px}.subtitle{text-align:center;font-size:22px;margin:24px 0 16px}.history,details{background:#fff9f7;border:3px solid white;border-radius:24px;padding:20px;margin-top:24px}summary{cursor:pointer;font-size:21px;font-weight:bold}.row{display:flex;gap:12px;justify-content:space-between;padding:12px 0;border-bottom:1px solid #eaddec;font-size:18px}.row b{white-space:nowrap}.muted{color:#947e9f;font-size:15px}.plus{color:#35845a}.minus{color:#b55b88}label{display:block;margin:16px 0 5px}input{width:100%;padding:12px;font:inherit;border:2px solid #dcc8e3;border-radius:14px}button{font:inherit;font-weight:bold;border:0;background:#c395ce;color:#fff;padding:13px 20px;border-radius:18px;margin:14px 8px 0 0;cursor:pointer;min-height:48px}p{line-height:1.5}.ver{text-align:center;font-size:14px;color:#9b84a5;margin-top:22px}#accountNote{text-align:center;font-size:17px;color:#8b7297}#setupStatus{font-size:17px}a:focus-visible,button:focus-visible{outline:4px solid #9671be;outline-offset:3px}</style><script src="../shared/wallet.js?v=v26"></script></head><body><main><a href="../?v=v26" style="font-size:25px">🏠 All games</a><h1>👧 Cecilia’s Account</h1><div class="balance"><b id="balance">🪙 0</b><p>Learn • Earn • Play</p></div><p id="accountNote"></p><section aria-labelledby="account-learn"><h2 class="subtitle" id="account-learn">🌟 Learn & Earn</h2><div class="grid"><a class="card" href="../word-garden/?v=v26"><span>🌻</span>Word Garden</a><a class="card" href="../sentence-stars/?v=v26"><span>⭐</span>Sentence Stars</a><a class="card" href="../word-match/?v=v26"><span>🧩</span>Word Match</a><a class="card" href="../math-quest/?v=v26"><span>🦉</span>Math Quest</a></div></section><section aria-labelledby="account-play" style="margin-top:35px;border-top:3px dashed #d8c3e5;padding-top:8px"><h2 class="subtitle" id="account-play">🏡 Play & Create</h2><div class="grid"><a class="card" href="../little-world/?v=v26"><span>🏡</span>Little World</a><a class="card" href="../fashion-studio/?v=v26"><span>👗</span>Fashion Studio</a></div></section><details><summary>🪙 My coin history</summary><div id="history"></div></details><p class="ver">Version 2.6 · 16 Oct 2026</p></main><script>
function renderAccount(){const W=CeciliaWallet;document.getElementById('balance').textContent='🪙 '+W.balance();document.getElementById('accountNote').textContent=W.status();const names={wg:'Word Garden',ss:'Sentence Stars',wm:'Word Match',math:'Math Quest',littleworld:'Little World',parent:'Parent'};document.getElementById('history').replaceChildren();W.records().slice(0,30).forEach(e=>{let r=document.createElement('div');r.className='row';let a=document.createElement('span');a.textContent=(names[e.source]||e.source)+' · '+e.reason+(e.status==='rejected'?' · returned':e.status==='pending'&&W.configured()?' · pending':'');let b=document.createElement('b');b.className=e.delta>=0?'plus':'minus';b.textContent=(e.status==='rejected'?'0':e.delta>=0?'+'+e.delta:e.delta)+' 🪙';r.append(a,b);document.getElementById('history').appendChild(r)})}
CeciliaWallet.onChange(renderAccount);
</script></body></html>
