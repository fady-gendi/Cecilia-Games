<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cecilia's Games">
<meta name="theme-color" content="#ffe8f3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="apple-touch-icon.png">
<title>Cecilia's Games</title>
<link rel="stylesheet" href="shared/cecilia.css?v=31">
<style>
/* The hub. Cards are built from the games list in shared/cecilia.js (CeciliaGames.list). */
*{box-sizing:border-box}
.wrap{max-width:1100px;margin:0 auto;padding:18px 16px 40px}
h1{text-align:center;font-size:42px;margin:6px 0 0}
h1 span{color:#f0559b}
.sub{text-align:center;font-size:22px;color:#6d5a85;margin:4px 0 18px}
h2{text-align:center;font-size:30px;margin:26px 0 12px;color:#805996}
.grid{text-align:center}
.card{display:inline-block;vertical-align:top;width:228px;margin:9px;text-align:center;text-decoration:none;color:#3d2f52;overflow:hidden;touch-action:manipulation;
 -webkit-transition:-webkit-transform .1s;transition:transform .1s}
.card:active{-webkit-transform:scale(.97);transform:scale(.97)}
.art{height:140px;font-size:84px;line-height:140px}
.body{padding:12px 14px 18px}
.name{font-size:26px;font-weight:bold;margin:0 0 4px}
.desc{font-size:17px;color:#6d5a85;margin:0 0 12px;min-height:44px}
.play{display:inline-block;padding:10px 30px;border-radius:999px;color:#fff;font-size:22px;font-weight:bold;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.stats{font-size:16px;color:#5b4d70;margin-top:10px;min-height:20px}
.hero{display:block;text-align:center;max-width:820px;margin:0 auto;text-decoration:none;color:#3d2f52;overflow:hidden;touch-action:manipulation}
.hero:active{-webkit-transform:scale(.98);transform:scale(.98)}
.hero .art{height:170px;line-height:170px;font-size:100px;background:#ffe3ef;background:-webkit-linear-gradient(left,#ffd6e0,#fff0c9,#d8f5d8,#d6ecff,#eadcff);background:linear-gradient(to right,#ffd6e0,#fff0c9,#d8f5d8,#d6ecff,#eadcff)}
.hero .name{font-size:34px}
.hero .desc{font-size:20px;min-height:0}
.coins{display:block;max-width:520px;margin:0 auto 6px;padding:12px;text-align:center;font-size:24px;font-weight:bold;text-decoration:none;color:#7a5200}
.coins b{font-size:30px}
.foot{text-align:center;margin-top:26px;font-size:17px;color:#9a8db0}
.foot a{color:#8e6bff;font-weight:bold;font-size:20px;text-decoration:none;display:inline-block;padding:12px 18px}
@media (max-width:560px){h1{font-size:30px}.card{width:100%;margin:8px 0}}
</style>
</head>
<body class="cg-page" data-cg-game="" data-cg-title="Cecilia’s Games" data-cg-home="off">
<div class="wrap">
 <h1>🌈 <span>Cecilia's</span> Games 🌈</h1>
 <p class="sub">Learn to earn coins. Spend them on a big adventure!</p>
 <a class="coins cg-card" href="account/">My coins: <b id="bal">0</b> <i class="cg-c"></i></a>
 <h2>📍 Adventure</h2>
 <div id="adventure"></div>
 <h2>📚 Learn &amp; Earn</h2>
 <div class="grid" id="learn"></div>
 <h2>🎨 Play</h2>
 <div class="grid" id="play"></div>
 <div class="foot"><a href="parent/">👪 Grown-ups</a><br>Version <span id="ver"></span></div>
</div>
<script src="shared/cecilia.js?v=31"></script>
<script>
(function(){'use strict';
var G=CeciliaGames,UI=CeciliaUI,esc=UI.esc;
function stats(g){
 var r=G.summarize(g,G.localSave(g)),out='';if(!r)return '';
 if(g.kind==='learn'&&g.id!=='math'){var bits=[];for(var k in r.langs)bits.push(k.toUpperCase()+' '+r.langs[k].level);out='⭐ '+r.stars+' · '+bits.join(' · ')}
 else out=r.lines.slice(0,2).join(' · ');
 return esc(out);
}
function card(g,hero){
 return '<a class="'+(hero?'hero':'card')+' cg-card" href="'+G.url(g)+'"><div class="art" style="background:'+(hero?'':g.bg)+'">'+g.icon+'</div><div class="body"><p class="name">'+esc(g.title)+'</p>'+
  '<p class="desc">'+esc(g.desc)+'</p><span class="play" style="background:'+g.color+'">▶ Play</span><div class="stats">'+stats(g)+'</div></div></a>';
}
var learn='',play='',adv='';
G.list.forEach(function(g){if(g.kind==='learn')learn+=card(g);else if(g.kind==='adventure')adv+=card(g,true);else play+=card(g)});
document.getElementById('learn').innerHTML=learn;document.getElementById('play').innerHTML=play;document.getElementById('adventure').innerHTML=adv;
document.getElementById('ver').textContent=G.version;
CeciliaWallet.onChange(function(){document.getElementById('bal').textContent=CeciliaWallet.balance()});
})();
</script>
</body>
</html>
