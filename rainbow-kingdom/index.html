/* ===================== state + saving ===================== */
function fresh(){return {game:'rainbow',v:1,ts:0,total:0,resetAt:0,done:{},given:{},seen:{},cur:null,wear:{dress:'d_pink',hat:'',pet:''},land:0}}
function count(o){var n=0,k;for(k in o)if(o[k])n++;return n}
function calcTotal(s){return count(s.done)*10+count(s.given)+count(s.seen)}
/* resetAt: a grown-up restarted the game (parent page). Anything done before that moment is ignored, on every device. */
function merge(a,b){
 var r=fresh(),k,newer=(b&&b.ts>(a&&a.ts||0))?b:a;
 r.resetAt=Math.max(a&&a.resetAt||0,b&&b.resetAt||0);
 [a,b].forEach(function(s){if(!s||s.game!=='rainbow')return;['done','given','seen'].forEach(function(f){for(k in s[f]||{})if(s[f][k]&&s[f][k]>=r.resetAt)r[f][k]=s[f][k]})});
 if(newer&&newer.game==='rainbow'&&(newer.resetAt||0)>=r.resetAt){r.cur=newer.cur||null;r.wear=Object.assign(r.wear,newer.wear||{});r.land=newer.land||0}
 r.ts=Math.max(a&&a.ts||0,b&&b.ts||0);r.total=calcTotal(r);return r;
}
var S=(function(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.game==='rainbow')return merge(s,null)}catch(e){}return fresh()})();
var cloudForce=false,cloudTimer=null,cloudBusy=false,cloudReady=false;
function save(){S.ts=new Date().getTime();S.total=calcTotal(S);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,2500)}
function cloudSave(){
 if(!cloudReady||cloudBusy){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudSave,5000);return}
 cloudBusy=true;
 CeciliaCloud.save(PROFILE,S,cloudForce).then(function(r){
  cloudBusy=false;
  if(r.ok){cloudForce=false;return}
  if(r.state&&r.state.game==='rainbow'){S=merge(S,r.state);S.ts=new Date().getTime()+1;try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}cloudTimer=setTimeout(cloudSave,500)}
  else{cloudForce=true;cloudTimer=setTimeout(cloudSave,500)} /* an old Little World save is replaced once */
 })['catch'](function(){cloudBusy=false;cloudTimer=setTimeout(cloudSave,20000)});
}
function cloudLoad(){
 CeciliaCloud.load(PROFILE).then(function(r){
  cloudReady=true;var cs=r&&r.state;
  if(cs&&cs.game==='rainbow'){var before=S.total,wasReset=S.resetAt||0;S=merge(S,cs);try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
   if((S.resetAt||0)>wasReset){if(cur!=='title')renderTitle(0)}else if(S.total!==before&&cur==='map')renderMap()}
  else if(cs)cloudForce=true;
  if(!cs||S.ts>=(cs.ts||0))cloudSave();
 })['catch'](function(){cloudReady=true;setTimeout(cloudLoad,30000)});
}
CeciliaCloud.onReconnect(function(){if(!cloudReady)cloudLoad();else cloudSave()});

/* ===================== coins + things she owns ===================== */
function price(id){return Math.max(0,Math.round(ITEMS[id].p*PRICE_SCALE))}
function ownedMap(){
 var m={d_pink:1};
 W.purchases(SOURCE).forEach(function(e){if(e.meta&&e.meta.type==='adv'&&e.status!=='rejected'&&ITEMS[e.meta.item]&&(e.created||0)>=(S.resetAt||0))m[e.meta.item]=1});
 return m;
}
function owns(id){return !!ownedMap()[id]||price(id)===0}
function buy(id){
 if(owns(id))return true;
 var tries=0,tx;
 W.purchases(SOURCE).forEach(function(e){if(e.meta&&e.meta.item===id)tries++});
 tx='adv:item:'+id+(tries?':'+tries:'');
 if(!W.spend(price(id),SOURCE,ITEMS[id].n,tx,{type:'adv',item:id}))return false;
 UI.sound('win');return true;
}
function coinsHTML(n){return '<span class="price">'+n+' '+COIN+'</span>'}

/* ===================== helpers ===================== */
function $(id){return document.getElementById(id)}
function esc(s){return UI.esc(s)}
function rnd(n){return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=rnd(i+1),t=a[i];a[i]=a[j];a[j]=t}return a}
/* fast, reliable taps on old iPads: touchend with a click fallback */
function onTap(node,fn){
 var sx=0,sy=0,moved=false,last=0;
 node.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;moved=false},false);
 node.addEventListener('touchmove',function(e){var t=e.touches[0];if(Math.abs(t.clientX-sx)>12||Math.abs(t.clientY-sy)>12)moved=true},false);
 node.addEventListener('touchend',function(e){if(moved)return;last=new Date().getTime();e.preventDefault();fn(e)},false);
 node.addEventListener('click',function(e){if(new Date().getTime()-last<700)return;fn(e)},false);
}

  B.innerHTML=h+'</div></div>';var bs=B.querySelectorAll('.opt'),ok=false;
  for(var i=0;i<bs.length;i++)(function(b){onTap(b,function(){if(ok)return;var o=st.o[+b.getAttribute('data-i')];
   if(o===st.a){ok=true;B.querySelector('.q').innerHTML=o;B.querySelector('.q').style.borderStyle='solid';UI.sound('pop');later(stepDone,700)}
   else{b.className='opt wiggle';UI.sound('oops');later(function(){b.className='opt'},420)}})})(bs[i]);
  M={clue:function(k){var s=st.q.slice(0,2).join(' then ');if(k>1){for(var i=0;i<bs.length;i++)if(st.o[i]===st.a)bs[i].className='opt glow'}
   return k>1?'The answer is shining. Tap it!':'Say it out loud: '+s+'... What comes next?'}};
 },
 match:function(st,B){
  talk(P.land.friend,st.x);goal(B,'Find two the same!');
  var deck=shuffle(st.p.concat(st.p)),wrap=document.createElement('div'),open=[],done=0,lock=false,cards=[];wrap.className='cards';B.appendChild(wrap);
  if(B.clientWidth<520||deck.length>10)wrap.style.zoom=deck.length>10?.85:1;
  deck.forEach(function(e,i){var c=document.createElement('button');c.className='card';c.innerHTML='⭐';wrap.appendChild(c);cards.push(c);
   onTap(c,function(){if(lock||c.className!=='card')return;c.className='card up';c.innerHTML=e;UI.sound('tap');open.push({c:c,e:e});
    if(open.length===2){lock=true;var a=open[0],b=open[1];open=[];
     if(a.e===b.e){later(function(){a.c.className=b.c.className='card ok';lock=false;done++;UI.sound('pop');if(done===st.p.length)later(stepDone,600)},350)}
     else later(function(){a.c.className=b.c.className='card';a.c.innerHTML=b.c.innerHTML='⭐';lock=false},900)}})});
  M={clue:function(k){if(k>1&&!lock){lock=true;cards.forEach(function(c,i){if(c.className==='card'){c.innerHTML=deck[i];c.className='card up'}});
    later(function(){cards.forEach(function(c){if(c.className==='card up'){c.className='card';c.innerHTML='⭐'}});lock=false},1800)}
   return k>1?'Peek! Look fast and remember!':'Tap two cards. Find two the same!'}};
 },
 sort:function(st,B){
  talk(P.land.friend,st.x);var all=[],sel=null,left=0;
  st.b.forEach(function(bin,bi){bin.i.forEach(function(e){all.push({e:e,bi:bi})})});all=shuffle(all);left=all.length;
  var tray=document.createElement('div');tray.className='tray';B.appendChild(tray);goal(B,'Tap a food, then tap a box.');
  var bins=document.createElement('div');bins.className='bins';B.appendChild(bins);var binEls=[];
  st.b.forEach(function(bin,bi){var d=document.createElement('div');d.className='bin';d.innerHTML=bin.e+' '+esc(bin.l)+'<div class="in"></div>';bins.appendChild(d);binEls.push(d);
   onTap(d,function(){if(!sel){UI.toast('First tap a thing at the top!');return}
    if(sel.it.bi===bi){d.querySelector('.in').innerHTML+=sel.it.e;sel.el.parentNode.removeChild(sel.el);sel=null;left--;UI.sound('pop');binEls.forEach(function(x){x.className='bin'});if(!left)later(stepDone,500)}
    else{d.className='bin wiggle';UI.sound('oops');later(function(){d.className='bin'},420)}})});
  all.forEach(function(it){var b=document.createElement('button');b.className='thing';b.innerHTML=it.e;tray.appendChild(b);
   onTap(b,function(){if(sel)sel.el.className='thing';sel={el:b,it:it};b.className='thing sel';UI.sound('tap')})});
  M={clue:function(){var it=sel?sel.it:null,el;if(!it){el=tray.querySelector('.thing');if(!el)return '';el.className='thing glow';return 'Tap a thing at the top first.'}
   binEls[it.bi].className='bin hot';return it.e+' goes in the '+st.b[it.bi].l+' box. Tap the pink box!'}};
 },
 dark:function(st,B){
  talk(P.land.friend,st.x);var pos=spots(1+st.d.length*2,20),found=false,target;
  pos.forEach(function(p,i){var b=document.createElement('button');b.className='thing';b.innerHTML=i===0?st.e:st.d[i%st.d.length];b.style.left=p[0]+'%';b.style.top=p[1]+'%';B.appendChild(b);
   if(i===0)target=b;onTap(b,function(){if(i!==0){b.className='thing wiggle';later(function(){b.className='thing'},420);return}if(found)return;found=true;b.className='thing got';dk.style.background='transparent';UI.sound('win');later(stepDone,700)})});
  var dk=document.createElement('div');dk.className='dark';B.appendChild(dk);var R=110;
  function light(x,y){var g='circle '+R+'px at '+x+'px '+y+'px';dk.style.background='-webkit-radial-gradient('+x+'px '+y+'px, circle, rgba(0,0,20,0) '+(R-20)+'px, rgba(0,0,20,.94) '+R+'px)';
   dk.style.background='radial-gradient('+g+', rgba(0,0,20,0) '+(R-30)+'px, rgba(0,0,20,.94) '+R+'px)';
   if(dk.style.background.indexOf('radial')<0)dk.style.background='-webkit-radial-gradient('+x+'px '+y+'px, circle, rgba(0,0,20,0) '+(R-20)+'px, rgba(0,0,20,.94) '+R+'px)'}
  function at(e){var t=e.touches?e.touches[0]:e,r=B.getBoundingClientRect();if(!t)return;light(t.clientX-r.left,t.clientY-r.top)}
  B.addEventListener('touchmove',function(e){at(e);e.preventDefault()},false);B.addEventListener('touchstart',at,false);B.addEventListener('mousemove',at,false);
  light(B.clientWidth/2,B.clientHeight/2);
  M={clue:function(k){if(k>1){R=190}var r=target.getBoundingClientRect(),br=B.getBoundingClientRect();if(k>2)light(r.left-br.left+38,r.top-br.top+38);return k>1?'I made the light bigger! Look for '+st.e:'Move your finger around. Look for '+st.e}};
 },
 buy:function(st,B){
  var it=ITEMS[st.i],have=owns(st.i),given=S.given[P.id+':'+st.i];
  talk(P.land.friend,st.x);
  function draw(){
   have=owns(st.i);var bal=W.balance(),pr=price(st.i),h='<div class="shopitem"><div class="e">'+it.e+'</div><div class="n">'+esc(it.n)+'</div>';
   if(have)h+='<div class="need">You have it! 🎒</div><button class="b green big pulse" id="bGive">Give '+it.e+'</button>';
   else if(bal>=pr)h+=coinsHTML(pr)+'<br><button class="b pink big pulse" id="bBuy">Buy it!</button>';
   else h+=coinsHTML(pr)+'<div class="need">You need <b>'+(pr-bal)+'</b> more '+COIN+'</div><button class="b gold big pulse" id="bEarn">Get coins 📚</button>';
   B.innerHTML='<div class="bc">'+h+'</div></div>';
   if($('bGive'))onTap($('bGive'),function(){S.given[P.id+':'+st.i]=new Date().getTime();save();UI.sound('win');var e=B.querySelector('.e');e.className='e wiggle';later(stepDone,500)});
   if($('bBuy'))onTap($('bBuy'),function(){if(buy(st.i)){UI.toast('You bought the '+it.n+'!');draw();UI.say('You bought it! Now give it.')}else{UI.sound('oops');draw()}});
   if($('bEarn'))onTap($('bEarn'),earnPanel);
  }
  draw();var unwatch=W.balance();every(function(){if(W.balance()!==unwatch||owns(st.i)!==have){unwatch=W.balance();draw()}},1500);
  M={clue:function(){if(owns(st.i))return 'Tap the green Give button!';var bal=W.balance(),pr=price(st.i);
   if(bal>=pr)return 'Tap Buy it! It costs '+pr+' coins. You have '+bal+'.';
   earnPanel();return 'You need '+(pr-bal)+' more coins. Play a learning game to earn them!'}};
  if(given&&have){/* replaying: already given before */}
 },
 gem:function(st,B){
  var L=P.land;talk(TW,'Look! The '+L.gemName+' gem! Tap it!');
  B.innerHTML='<div class="gemfx'+(L.gem==='rainbow'?' rainbow':'')+'" id="gGem" style="background:'+(L.gem==='rainbow'?'':L.gem)+'"></div>';
  if(L.gem==='rainbow'){var g=$('gGem');g.style.background='-webkit-linear-gradient(left,#ff4d6d,#ff9f43,#ffd23f,#3cb371,#4f8cff,#5b5bd6,#a35bd6)';g.style.background='linear-gradient(to right,#ff4d6d,#ff9f43,#ffd23f,#3cb371,#4f8cff,#5b5bd6,#a35bd6)'}
  onTap($('gGem'),function(){UI.confetti(30);stepDone()});

};

/* "I need more coins" — sends her to the learning games, then back. */
function earnPanel(){
 var h='<div class="cg-big">📚</div><h2>Earn more coins!</h2><p>Play a learning game.<br>Every right answer gives coins.</p><div class="cg-cards">';
 CeciliaGames.learn().forEach(function(g){h+='<a class="cg-gcard" style="background:'+g.bg+'" href="'+CeciliaGames.url(g)+'"><span class="cg-gi">'+g.icon+'</span><b>'+esc(g.title)+'</b><small>+10 '+COIN+' each</small></a>'});
 h+='</div><p class="cg-small">Come back here after. Your adventure is saved!</p>';
 UI.modal(h);UI.say('Earn more coins! Play a learning game. Then come back. Your adventure is saved!');
}

/* --- shop --- */
var shopTab='quest';
function landReached(){var n=nextLevel();return n?n.li:LANDS.length}
function questNeeded(){ /* items for every level in the lands she has reached, so she can save up ahead */
 var need={};
 LANDS.forEach(function(L,li){if(landOpen(li))L.levels.forEach(function(lv,vi){lv.s.forEach(function(st){if(st.t==='buy')need[st.i]=lid(li,vi)})})});
 return need;
}
function renderShop(fromLevel){
 show('shop');var tabs=[['quest','📍 Quest'],['dress','👗 Dresses'],['hat','🎀 Hats'],['pet','🐱 Pets'],['home','🏡 Home']],h='<div class="row"><button class="b gray" id="pBack">⬅</button><h2 class="grow" style="text-align:center">🏪 Rainbow Shop</h2>'+
  '<span class="pill">'+W.balance()+' '+COIN+'</span></div><div class="tabs">';
 tabs.forEach(function(t){h+='<button class="tab'+(shopTab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>'});h+='</div><div class="shelf">';
 var own=ownedMap(),need=questNeeded(),reach=landReached(),want=P&&cur!=='map'?P.lv.s[P.step]:null,list=[],k;
 for(k in ITEMS)if(ITEMS[k].k===shopTab)list.push(k);
 if(shopTab==='quest')list=list.filter(function(k){return need[k]});
 if(!list.length)h+='<p style="font-size:24px">Play more levels to see new things! 🌈</p>';
 list.forEach(function(k){var it=ITEMS[k],o=own[k]||price(k)===0,locked=(it.land||0)>reach,w=fromLevel&&P&&P.lv.s[P.step].i===k;
  h+='<div class="it'+(o?' own':'')+(locked?' lock':'')+(w?' want':'')+'" data-k="'+k+'">'+(w?'<span class="tag">Needed!</span>':'')+
   '<div class="e">'+(it.k==='dress'?'<span class="swatch" style="background:'+(it.c==='rainbow'?'#f0559b':it.c)+'"></span>':it.e)+'</div><div class="n">'+esc(it.n)+'</div>'+
   (o?'<b style="color:#3cb371">✔ '+(it.k==='quest'?'In bag':'Mine')+'</b>':(locked?'🔒 Land '+((it.land||0)+1):coinsHTML(price(k))))+'</div>'});
 h+='</div>';
 if(fromLevel)h+='<div style="text-align:center"><button class="b pink big" id="pResume">▶ Back to level</button></div>';
 $('s-shop').innerHTML=h;
 onTap($('pBack'),function(){if(fromLevel&&P)resume();else renderMap()});
 if($('pResume'))onTap($('pResume'),resume);
 var ts=$('s-shop').querySelectorAll('.tab');for(var i=0;i<ts.length;i++)(function(t){onTap(t,function(){shopTab=t.getAttribute('data-t');renderShop(fromLevel)})})(ts[i]);
 var is=$('s-shop').querySelectorAll('.it');for(i=0;i<is.length;i++)(function(d){onTap(d,function(){shopItem(d.getAttribute('data-k'),fromLevel)})})(is[i]);
}
function resume(){show('level');startLevel(P.id)}
function shopItem(k,fromLevel){
 var it=ITEMS[k],o=owns(k),bal=W.balance(),pr=price(k),reach=landReached();
 if(o){if(it.k!=='quest'){wearIt(k);UI.toast('You are wearing it!')}else UI.toast('It is in your bag 🎒');renderShop(fromLevel);return}
 if((it.land||0)>reach){UI.sound('oops');UI.toast('Reach land '+((it.land||0)+1)+' to unlock!');return}
 var h='<div class="cg-big">'+(it.k==='dress'?'<span class="swatch" style="width:90px;height:90px;background:'+(it.c==='rainbow'?'#f0559b':it.c)+'"></span>':it.e)+'</div><h2>'+esc(it.n)+'</h2>'+coinsHTML(pr);
 if(bal>=pr)h+='<p>Buy it?</p><button class="b pink big" id="yBuy">Yes, buy!</button><button class="b white" id="yNo">No</button>';
 else h+='<p>You need <b>'+(pr-bal)+'</b> more coins.</p><button class="b gold big" id="yEarn">Get coins 📚</button>';
 UI.modal(h);UI.say(bal>=pr?it.n+'. '+pr+' coins. Buy it?':'You need '+(pr-bal)+' more coins.');
 if($('yBuy'))onTap($('yBuy'),function(){UI.close();if(buy(k)){if(it.k!=='quest')wearIt(k);UI.confetti(12);UI.toast('Yay! You got the '+it.n+'!')}renderShop(fromLevel)});
 if($('yNo'))onTap($('yNo'),function(){UI.close()});
 if($('yEarn'))onTap($('yEarn'),function(){UI.close();earnPanel()});
}
function wearIt(k){var it=ITEMS[k];if(it.k==='dress')S.wear.dress=k;else if(it.k==='hat')S.wear.hat=S.wear.hat===k?'':k;else if(it.k==='pet')S.wear.pet=S.wear.pet===k?'':k;save()}

/* --- my home (tree house) --- */
function renderHome(){
 show('home');var own=ownedMap(),h='<div class="row"><button class="b gray" id="hBack">⬅</button><h2 class="grow" style="text-align:center">🏡 My Tree House</h2><button class="b orange" id="hShop">🏪 Shop</button></div>';
 h+='<div class="house"><svg class="bg" viewBox="0 0 1000 580" preserveAspectRatio="none" style="position:absolute;top:0;left:0;width:100%;height:100%">'+
  '<rect width="1000" height="580" fill="#d9f2ff"/><circle cx="880" cy="90" r="50" fill="#ffe27a"/><path d="M0 470 Q500 420 1000 470 L1000 580 L0 580Z" fill="#8fd18a"/>'+
  '<rect x="440" y="250" width="120" height="250" rx="20" fill="#9b6b43"/><ellipse cx="500" cy="170" rx="380" ry="150" fill="#6fcf7f"/><ellipse cx="330" cy="200" rx="160" ry="100" fill="#5cbf6e"/><ellipse cx="680" cy="190" rx="170" ry="100" fill="#5cbf6e"/>'+
  '<rect x="300" y="190" width="400" height="190" rx="24" fill="#f7d9a6" stroke="#c99a5e" stroke-width="8"/><path d="M280 200 L500 90 L720 200 Z" fill="#f0559b"/><rect x="460" y="270" width="80" height="110" rx="38" fill="#c98a5a"/>'+
  '<rect x="340" y="230" width="80" height="60" rx="12" fill="#bfe6ff" stroke="#fff" stroke-width="6"/><rect x="580" y="230" width="80" height="60" rx="12" fill="#bfe6ff" stroke="#fff" stroke-width="6"/></svg>';
 var k;for(k in ITEMS){var it=ITEMS[k];if(it.k!=='home')continue;h+='<span class="slot'+(own[k]?'':' empty')+'" style="left:'+it.x+'%;top:'+it.y+'%">'+(own[k]?it.e:'⭐')+'</span>'}
 var fx=6;LANDS.forEach(function(L,i){if(gemDone(i)){h+='<span class="fr" style="left:'+fx+'%">'+L.friend.e+'</span>';fx+=i===2?22:9}});
 h+='<div class="mebig">'+cecilia()+'</div>'+(S.wear.pet&&ITEMS[S.wear.pet]?'<span class="petbig">'+ITEMS[S.wear.pet].e+'</span>':'')+'</div>';
 h+='<h2 style="text-align:center">My things</h2><div class="wear">';
 var mine=0;for(k in ITEMS){var t=ITEMS[k];if(['dress','hat','pet'].indexOf(t.k)<0||!(own[k]||price(k)===0))continue;mine++;
  var on=S.wear.dress===k||S.wear.hat===k||S.wear.pet===k;
  h+='<div class="it'+(on?' on':'')+'" data-k="'+k+'"><div class="e">'+(t.k==='dress'?'<span class="swatch" style="background:'+(t.c==='rainbow'?'#f0559b':t.c)+'"></span>':t.e)+'</div><div class="n">'+esc(t.n)+'</div></div>'}
 h+='</div><p style="text-align:center;font-size:22px">'+(mine<3?'Buy dresses, hats and pets in the shop! 🏪':'Tap a thing to wear it.')+'</p>';
 $('s-home').innerHTML=h;
 onTap($('hBack'),function(){renderMap()});onTap($('hShop'),function(){shopTab='home';renderShop()});
 var is=$('s-home').querySelectorAll('.wear .it');for(var i=0;i<is.length;i++)(function(d){onTap(d,function(){wearIt(d.getAttribute('data-k'));UI.sound('pop');renderHome()})})(is[i]);
 UI.say('Your tree house!');
}

/* --- the end --- */
function ending(){
 UI.confetti(40);
 var h='<div class="cg-big">🌈</div><h2>You did it, Cecilia!</h2><div style="font-size:54px">'+LANDS.map(function(L){return L.friend.e}).join(' ')+'</div>'+
  '<p class="end">The colors are back!<br>Cloudy is happy now.<br>All your friends say:<br><b>THANK YOU, RAINBOW HERO!</b></p>'+
  '<p class="cg-small">Keep learning to buy new things for your home.</p><button class="b pink big" id="eOk">🏡 My Home</button>';
 UI.modal(h,function(){renderMap(7)});UI.say('You did it, Cecilia! The colors are back! Thank you, Rainbow Hero!');
 onTap($('eOk'),function(){UI.close();renderHome()});
}

/* refresh coin-dependent screens when coins arrive from the cloud */
var lastBal=W.balance();
W.onChange(function(){var b=W.balance();if(b===lastBal)return;lastBal=b;if(cur==='shop'&&!document.getElementById('cgModal'))renderShop(!!(P&&S.cur))});
window.RainbowKingdom={S:function(){return S},step:function(){return P&&P.shown===P.step?P.step:-1},LANDS:LANDS,ITEMS:ITEMS,start:startLevel,map:renderMap,shop:renderShop,home:renderHome};

if(S.seen.intro)renderMap();else renderTitle(0);
cloudLoad();
})();
