<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#e6f5ef"><title>Cecilia’s Math Quest</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7ef;color:#243f45;font-family:'Trebuchet MS',Arial,sans-serif}button,a{touch-action:manipulation}button{font:inherit;cursor:pointer;border:0;border-radius:18px;min-height:52px;padding:12px 20px;background:#237b70;color:white;font-weight:bold}button:disabled{opacity:.5;cursor:default}button:focus-visible,a:focus-visible{outline:4px solid #e59e27;outline-offset:3px}header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;max-width:1080px;margin:auto;padding:18px}header a{color:inherit;text-decoration:none;font-size:25px}header b{flex:1}main{max-width:1000px;margin:auto;padding:12px 20px 40px}.hero{background:#dceee6;border-radius:30px;padding:26px;margin-bottom:20px;position:relative}.hero h1{font-size:clamp(30px,6vw,48px);margin:8px 0}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:bold;color:#54756e}.muted{color:#577078;line-height:1.6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(215px,1fr));gap:14px}.level{background:white;color:#243f45;text-align:left;padding:22px;border:2px solid #e2e9de;min-height:170px}.level .icon{font-size:36px}.level strong{display:block;font-size:19px;margin:10px 0}.level small{display:block;line-height:1.5}.stars{color:#aa7200;margin-top:12px}nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.secondary{background:#e6ece5;color:#29494a}.panel{background:white;border-radius:28px;padding:clamp(18px,4vw,35px);text-align:center;max-width:750px;margin:auto;border:2px solid #e1e9df}.problem{font-size:clamp(34px,8vw,64px);margin:24px 0;font-weight:bold}.story{font-size:clamp(23px,4vw,32px);line-height:1.5}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{background:#edf4ee;color:#254c4d;border:2px solid #d6e6dc;font-size:28px;min-height:80px}.answers button.bad{background:#ffe4d7}.answers button.good{background:#bdebcf}.progress{height:12px;background:#e5ece5;border-radius:20px;overflow:hidden;margin:12px 0}.progress i{display:block;background:#e9b54c;height:100%;transition:width .3s}#message{min-height:56px;font-size:20px;font-weight:bold;padding:12px}#hintBox{background:#fff6dc;border-radius:18px;padding:16px;margin:12px 0;line-height:1.7}.tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.trophy{background:white;border-radius:22px;padding:22px;text-align:center;border:2px solid #e1e9df}.trophy span{font-size:42px}.locked{filter:grayscale(1);opacity:.6}.pill{background:white;padding:9px 12px;border-radius:20px;font-size:14px}.dots{font-size:25px;letter-spacing:5px;overflow-wrap:anywhere}input{padding:12px;max-width:100%;font:inherit}details{text-align:left;line-height:1.8}summary{cursor:pointer;font-weight:bold}#celebrate{font-size:65px}.tiny{font-size:13px} @media(max-width:450px){header{padding:12px}.grid{grid-template-columns:1fr 1fr;gap:8px}.level{padding:14px;min-height:180px}.level strong{font-size:16px}main{padding:10px 12px}.pill{font-size:12px;padding:8px}nav button{flex:1;padding:10px} }
</style><header><a href="../" aria-label="All games">🏠</a><b>🌟 Math Quest</b><span class="pill" id="stats"></span></header><main id="app"></main><script>
'use strict';
const KEY='cecilia_math_quest_age7_v2';let saveOK=true;let state={best:{},solved:0,days:[],review:[],sessions:0};try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.best&&Array.isArray(s.days)&&Array.isArray(s.review))state=Object.assign(state,s)}catch(e){}
const worlds=[['🧠','Number Detectives','Order numbers & solve clues to 100','count'],['🍎','Addition Orchard','Add within 20, then 50','add10'],['🐰','Subtraction Woods','Subtract within 20, then 50','sub10'],['🌈','Missing Number Bridge','Missing parts & number bonds','bonds'],['🐬','Ocean Challenges','Mixed operations within 50','twenty'],['🏡','Tens Town','Place value & tens to 100','place'],['🚂','Pattern Railway','Sequences & missing steps','pattern'],['🏰','Hundred Castle','Two-digit sums & differences','hundred'],['🍕','Multiplication Picnic','Times tables & equal sharing','groups'],['🕰️','Clock & Coin Cove','Time, change & elapsed minutes','time'],['📚','Story Mountain','Two-step everyday problems','story'],['🚀','Star Academy','Mixed maths challenge','mixed']];
let run=null,q=null,tries=0,helped=false,answered=false;
const app=document.getElementById('app');const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));const pick=a=>a[R(0,a.length-1)];const shuffle=a=>a.sort(()=>Math.random()-.5);const totalStars=()=>Object.values(state.best).reduce((a,b)=>a+b,0);const completed=()=>Object.keys(state.best).filter(k=>state.best[k]>=1).length;const unlocked=i=>i===0||state.best[i*3-1]>=1;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));saveOK=true}catch(e){saveOK=false}stats()}
function stats(){document.getElementById('stats').textContent='⭐ '+totalStars()+' · 💎 '+state.solved;}
function home(){run=null;stats();app.innerHTML='<div class="hero"><div class="eyebrow">CECILIA’S GREAT NUMBER ADVENTURE</div><h1>Little steps. Big discoveries. 🌟</h1><p class="muted">Explore 12 worlds, collect trophies and become a confident maths explorer. Take your time — thinking is your superpower.</p><button onclick="resume()">Continue adventure →</button></div><nav><button class="secondary" onclick="practice()">🌻 Daily mix</button><button class="secondary" onclick="trophies()">🏆 Trophies</button><button class="secondary" onclick="parent()">⚙️ Grown-ups</button></nav>'+(!saveOK?'<p>Progress could not be saved. Keep this page open and enable browser storage.</p>':'')+'<div class="grid">'+worlds.map((w,i)=>'<button class="level" '+(!unlocked(i)?'disabled':'')+' onclick="world('+i+')"><span class="icon">'+w[0]+'</span><strong>'+w[1]+'</strong><small>'+w[2]+'</small><div class="stars">'+[0,1,2].map(j=>state.best[i*3+j]?'★'.repeat(state.best[i*3+j]):'☆').join(' ')+'</div><small>'+(unlocked(i)?'3 levels · 8 questions each':'🔒 Finish the previous world')+'</small></button>').join('')+'</div>'}
function world(i){app.innerHTML='<button class="secondary" onclick="home()">← World map</button><div class="hero"><h1>'+worlds[i][0]+' '+worlds[i][1]+'</h1><p>'+worlds[i][2]+'</p></div><div class="grid">'+[0,1,2].map(j=>{let id=i*3+j,open=j===0||state.best[id-1];return '<button class="level" '+(!open?'disabled':'')+' onclick="start('+id+')"><strong>'+['Discover','Explore','Master'][j]+'</strong><small>Level '+(id+1)+' · 8 questions</small><div class="stars">'+(state.best[id]?'★'.repeat(state.best[id]):'☆☆☆')+'</div></button>'}).join('')+'</div>'}
function resume(){for(let i=0;i<36;i++)if(!state.best[i]){start(i);return}start(35)}
function question(type,d=0){let a,b,n,step;const make=(text,answer,hint,visual='')=>({text,answer,hint,visual,type,d});
if(type==='mixed')return question(pick(worlds.slice(0,11).map(w=>w[3])),d);
if(type==='count'){a=R(12,85);if(d===0){b=R(2,9);return make('What number is '+b+' more than '+a+'?',a+b,'Add '+b+' to '+a+'. You can bridge through the next ten.')}if(d===1){a=R(21,89);return make('What number is 10 less than '+a+'?',a-10,'Subtract one ten. Keep the ones digit the same.')}a=R(12,47)*2;return make('I am even, between '+(a-1)+' and '+(a+1)+'. What am I?',a,'Even numbers can be split into two equal whole-number groups. Find the number between the clues.')}
if(['add10','sub10','twenty','hundred'].includes(type)){let max=type==='hundred'?99:type==='twenty'?50:d===2?50:20;let sub=type==='sub10'||(['twenty','hundred'].includes(type)&&R(0,1));if(sub){a=R(type==='hundred'?30:12,max);b=R(3,a-3)}else{a=R(type==='hundred'?12:4,max-(type==='hundred'?10:6));b=R(type==='hundred'?10:3,max-a)}return make(a+(sub?' − ':' + ')+b+' = ?',sub?a-b:a+b,sub?'Split '+b+' into tens and ones. Subtract the tens, then the ones. You can also count up from '+b+' to '+a+'.':'Make a ten first, or split '+b+' into tens and ones and add in steps.')}
if(type==='bonds'){n=d===0?20:d===1?50:100;a=R(3,n-3);return make(d===2?'? − '+a+' = '+(n-a):a+' + ? = '+n,d===2?n:n-a,d===2?'Addition undoes subtraction: add '+a+' to '+(n-a)+'.':'Find the difference between '+n+' and '+a+'. Count up in steps.')}
if(type==='place'){a=R(2,9);b=R(1,9);n=a*10+b;if(d===0)return make('In '+n+', what is the value of the digit '+a+'?',a*10,'The digit '+a+' is in the tens column, so its value is '+a+' × 10.');if(d===1)return make(n+' + '+(a===9?-20:10)+' = ?',n+(a===9?-20:10),'Change the tens. The ones stay the same.');return make('Swap the digits of '+n+'. What number do you get?',b*10+a,'The ones become tens, and the tens become ones.')}
if(type==='pattern'){step=pick(d===0?[2,5,10]:d===1?[3,4,6]:[7,8,9]);a=R(1,6)*step;if(d===2)return make((a+3*step)+', '+(a+2*step)+', ?, '+a,a+step,'This sequence goes down by '+step+' each time.');return make(a+', '+(a+step)+', ?, '+(a+step*3),a+step*2,'The difference between each pair is '+step+'. Add the same amount each time.')}
if(type==='groups'){a=pick(d===0?[2,5,10]:d===1?[2,3,4,5,10]:[3,4,6,7]);b=R(2,d===2?10:6);return d===2?make(a*b+' berries shared equally by '+a+' friends. Each gets…',b,'Think: '+a+' × what number = '+a*b+'?'):make(a+' × '+b+' = ?',a*b,'Think of '+a+' equal groups of '+b+'. Add '+b+' each time.')}
if(type==='time'){if(d===0){a=pick([15,20,25,30,35]);b=R(2,a-2);return make('Pay '+a+' EGP for a toy costing '+b+' EGP. Change?',a-b,'Change is the amount paid minus the price: '+a+' − '+b+'.')}if(d===1){a=R(1,10);b=pick([15,30,45]);return make('At '+a+':'+b+', how many minutes until '+(a+1)+':00?',60-b,'There are 60 minutes in an hour. Subtract '+b+' from 60.')}a=pick([15,30,45]);b=pick([15,30,45]);return make('Read for '+a+' minutes, then play for '+b+'. Total minutes?',a+b,'Add both time periods: '+a+' + '+b+'.')}
a=R(12,d===2?40:25);b=R(3,9);n=R(2,8);return make('Cecilia has '+a+' stickers, finds '+b+' more, then gives away '+n+'. How many remain?',a+b-n,'Two steps: first add '+a+' + '+b+'. Then subtract '+n+'.')}
function start(id,mode='level'){run={id,mode,index:0,clean:0,queue:[],missed:[],types:{}};next()}
function practice(){start(Math.min(35,completed()),'practice')}
function next(){if(run.index===8){finish();return}let wi=Math.floor(run.id/3),d=run.id%3;if(run.mode==='practice'){let old=state.review[run.index];q=old?question(old.type,old.d):question(pick(worlds.slice(0,Math.min(12,Math.floor(completed()/3)+1)).map(w=>w[3])),R(0,2))}else q=question(worlds[wi][3],d);tries=0;helped=false;answered=false;renderQuestion()}
function renderQuestion(){const choices=new Set([q.answer]);while(choices.size<4){let v=q.answer+R(-Math.max(3,Math.ceil(q.answer*.3)),Math.max(3,Math.ceil(q.answer*.3)));if(v>=0)choices.add(v)}app.innerHTML='<div class="panel"><div style="display:flex;justify-content:space-between;align-items:center"><button class="secondary" onclick="leave()">← Map</button><b>'+(run.mode==='practice'?'Daily mix':'Level '+(run.id+1))+' · '+(run.index+1)+'/8</b></div><div class="progress"><i style="width:'+run.index/8*100+'%"></i></div><p class="muted">'+pick(['You can figure this out.','Take your time, explorer.','Small steps make a big difference.'])+'</p><div class="problem '+(q.text.length>30?'story':'')+'">'+esc(q.text)+'</div><div id="visual" class="dots" '+(q.visual?'':'hidden')+'>'+q.visual+'</div><div class="answers">'+shuffle([...choices]).map(v=>'<button onclick="answer('+v+',this)">'+v+'</button>').join('')+'</div><div id="message" role="status" aria-live="polite"></div><div id="hintBox" hidden></div><div class="tools"><button class="secondary" onclick="hint()">💡 Show me how</button><button class="secondary" onclick="speak()">🔊 Read it</button><button id="next" hidden onclick="advance()">Next →</button></div></div>'}
function answer(v,el){if(answered)return;if(v!==q.answer){tries++;el.classList.add('bad');el.disabled=true;document.getElementById('message').textContent='Good thinking. Let’s try another way.';hint();if(tries>=2)document.getElementById('hintBox').textContent=q.hint+' The answer is '+q.answer+'. Tap it to practise.';return}answered=true;el.classList.add('good');document.querySelectorAll('.answers button').forEach(b=>b.disabled=true);if(!tries&&!helped)run.clean++;else run.missed.push({type:q.type,d:q.d});state.solved++;document.getElementById('message').textContent=tries||helped?'You worked it out! 🌱':'Wonderful thinking! ✨';document.getElementById('next').hidden=false;persist()}
function hint(){helped=true;const h=document.getElementById('hintBox');h.hidden=false;h.textContent=q.hint;if(q.visual)document.getElementById('visual').hidden=false}
function speak(){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(q.text.replace('−',' minus ').replace('+',' plus ').replace('=',' equals ').replace('?',' what number '));u.lang='en-GB';u.rate=.85;speechSynthesis.speak(u)}else document.getElementById('message').textContent='Read-aloud is unavailable in this browser.'}
function advance(){if(!answered)return;run.index++;next()}
function leave(){if(confirm('Return to the map? Completed answers are saved; this level will restart.'))home()}
function finish(){let stars=run.clean>=7?3:run.clean>=5?2:1;let pass=run.clean>=5;if(run.mode==='level'&&pass)state.best[run.id]=Math.max(state.best[run.id]||0,stars);state.sessions++;let date=new Date().toLocaleDateString('en-CA');if(!state.days.includes(date))state.days.push(date);state.review=run.missed.concat(state.review).slice(0,24);if(run.mode==='practice')state.review=run.missed.concat(state.review.slice(8)).slice(0,24);persist();let id=run.id,practiceMode=run.mode==='practice';app.innerHTML='<div class="panel"><div id="celebrate">'+(pass?'🏆':'🌱')+'</div><h1>'+(pass?'Look how you’ve grown!':'Your maths is growing!')+'</h1><div class="problem">'+'⭐'.repeat(stars)+'</div><p>'+run.clean+' of 8 solved independently.</p><p class="muted">'+(practiceMode?'Lovely practice! Your tricky skills will come back in future mixes.':pass?'Level complete! Your best stars are saved.': 'Solve 5 independently to unlock the next level. Use the tips, then try again — you can do it!')+'</p><div class="tools"><button onclick="start('+id+',\''+(practiceMode?'practice':'level')+'\')">Play again</button>'+(!practiceMode&&pass&&id<35?'<button onclick="start('+(id+1)+')">Next level →</button>':'')+'<button class="secondary" onclick="home()">World map</button><button class="secondary" onclick="trophies()">My trophies</button></div></div>'}
function trophies(){let ts=[['🌱','First steps',state.solved>=1,'Solve your first problem'],['💎','Number collector',state.solved>=50,'Solve 50 problems'],['🦉','Wise explorer',state.solved>=200,'Solve 200 problems'],['🌞','Three-day explorer',state.days.length>=3,'Practise on 3 different days'],['⭐','Star collector',totalStars()>=30,'Collect 30 level stars'],...worlds.map((w,i)=>[w[0],w[1]+' trophy',state.best[i*3+2]>=1,'Complete all 3 levels in this world'])];app.innerHTML='<button class="secondary" onclick="home()">← Map</button><div class="hero"><h1>🏆 My trophy shelf</h1><p>'+ts.filter(t=>t[2]).length+' of '+ts.length+' trophies earned</p></div><div class="grid">'+ts.map(t=>'<div class="trophy '+(!t[2]?'locked':'')+'"><span>'+t[0]+'</span><h3>'+t[1]+'</h3><p>'+t[3]+'</p><b>'+(t[2]?'Earned!':'Keep exploring')+'</b></div>').join('')+'</div>'}
function parent(){app.innerHTML='<button class="secondary" onclick="home()">← Map</button><div class="panel"><h1>For grown-ups</h1><p class="muted">Start with a relaxed 5–10 minutes. Ask “How did you work it out?” Replay for confidence. No speed pressure or lost lives.</p><p><b>'+completed()+'/36 levels completed · '+state.solved+' problems solved · '+state.days.length+' practice days</b></p><details open><summary>How progression works</summary><p>Eight questions per level. Five independent answers unlock the next level (2 stars); seven earn 3 stars. Hints and retries always help learning, but do not count as independent answers. Daily mix revisits skills from missed or helped questions. Starts with mental maths within 20 and number reasoning to 100. Later worlds introduce multiplication, change, elapsed time and two-step stories. This harder edition has its own progress; the earlier edition’s saved data stays on this device.</p></details><details><summary>Progress & backup</summary><p>Saved on this browser and device only. Private browsing, clearing site data or switching devices can lose progress. Download a backup to move or protect it.</p><button onclick="backup()">Download backup</button><p><label>Restore backup <input type="file" accept="application/json,.json" onchange="restore(this)"></label></p><p id="restoreMsg" role="status"></p></details></div>'}
function backup(){let blob=new Blob([JSON.stringify(state)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='cecilia-math-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restore(input){try{let s=JSON.parse(await input.files[0].text());if(!s||!s.best||typeof s.best!=='object'||!Array.isArray(s.days)||!Array.isArray(s.review)||!Number.isSafeInteger(s.solved)||s.solved<0||!Object.entries(s.best).every(([k,v])=>/^\d+$/.test(k)&&+k<36&&[1,2,3].includes(v))||!s.review.every(x=>x&&worlds.some(w=>w[3]===x.type)&&[0,1,2].includes(x.d)))throw Error();if(confirm('Replace this device’s maths progress with this backup?')){state={best:s.best,days:s.days.filter(d=>typeof d==='string'),review:s.review.slice(0,24),solved:s.solved,sessions:Number.isSafeInteger(s.sessions)?s.sessions:0};persist();parent();document.getElementById('restoreMsg').textContent='Backup restored.'}}catch(e){document.getElementById('restoreMsg').textContent='That backup could not be read. Please choose a Math Quest backup.'}}
home();
</script></html>
