<script data-root="../">

(function(){'use strict';

var KEY='cecilia_global_wallet_v1',sources=['wg','ss','wm','math','littleworld','parent'],busy=false,timer=null,listeners=[],state,config={url:ENDPOINT};

function balance(){var cloud=configured()&&state.snapshot&&state.snapshot.url===config.url;return Math.max(0,cloud?state.snapshot.balance+Object.values(state.entries).reduce(function(n,e){return n+effective(e)},0):Object.values(state.entries).reduce(function(n,e){return n+(e.status==='rejected'?0:e.delta)},0));}
function notify(){listeners.forEach(function(fn){try{fn()}catch(e){console.error(e)}});var b=document.getElementById('globalWalletBadge');if(b)b.textContent='👧 🪙 '+balance()+(configured()?'':' · Device');}
function write(){try{var disk=read();Object.keys(disk.entries).forEach(function(id){if(!state.entries[id])state.entries[id]=disk.entries[id]});localStorage.setItem(KEY,JSON.stringify(state))}catch(e){status='Storage unavailable';}notify();}
var status=configured()?'Connecting…':'Shared on this device';
function schedule(){clearTimeout(timer);if(configured())timer=setTimeout(function(){sync(false)},state.snapshot?4000:250)}
function importCoins(source,n,alreadyShared){if(!sources.includes(source))return;state=read();var id='migration:'+source,n=Math.max(0,Math.floor(Number(n)||0)),old=state.entries[id];if(alreadyShared&&!old)return;if(old&&old.delta>=n)return;if(alreadyShared)return;state.entries[id]={id:id,source:source,kind:'migration',delta:Math.max(n,old?old.delta:0),reason:'Existing '+source+' coins',created:old?old.created:Date.now(),status:'pending',meta:{}};write();schedule()}
function add(delta,source,reason,id,meta,kind){state=read();id=id||source+':'+uid();if(state.entries[id])return state.entries[id].status!=='rejected'?id:false;if(!Number.isSafeInteger(delta)||Math.abs(delta)>1000000||!sources.includes(source))return false;if(delta<0&&balance()<-delta)return false;state.entries[id]={id:id,source:source,kind:kind||(delta<0?'spend':'earn'),delta:delta,reason:reason,meta:meta||{},created:Date.now(),status:'pending'};write();schedule();return id;}
function award(n,source,reason,id){return add(Math.max(0,Math.floor(n)),source,reason,id,null,source==='parent'?'parent':'earn')}
function spend(n,source,reason,id,meta){return add(-Math.abs(Math.floor(n)),source,reason,id,meta,'spend')}
function records(){return Object.values(state.entries).sort(function(a,b){return b.created-a.created})}
function purchases(source){var all={};if(state.snapshot)(state.snapshot.grants||[]).filter(function(e){return e.source===source}).forEach(function(e){all[e.id]=e});records().filter(function(e){return e.source===source&&e.kind==='spend'}).forEach(function(e){all[e.id]=e});return Object.values(all)}
async function request(events){var ctrl=new AbortController(),timeout=setTimeout(function(){ctrl.abort()},30000);try{var r=await fetch(config.url,{method:'POST',body:JSON.stringify({action:'wallet.sync',account:'cecilia',events:events}),redirect:'follow',signal:ctrl.signal});if(r.headers&&/text\/html/i.test(r.headers.get('content-type')||'')){var wrong=new Error('Account server unavailable. Progress remains saved here.');wrong.permanent=true;throw wrong}try{return await r.json()}catch(parseError){if(parseError.permanent)throw parseError;var invalid=new Error('Account server returned an unexpected response. Progress remains saved here.');invalid.permanent=true;throw invalid}}finally{clearTimeout(timeout)}}

// Import existing learning balances once. Game adapters also import a newer legacy cloud copy.
[['wg','wordgarden_v1'],['ss','sentencestars_v1'],['wm','wordmatch_v1'],['math','cecilia_math_quest_age7_v2']].forEach(function(a){try{var s=JSON.parse(localStorage.getItem(a[1]));if(s)importCoins(a[0],a[0]==='math'?(s.solved||0)*10:s.coins,!!s.walletV)}catch(e){}});
schedule();
})();



/* Automatic background progress saving for Cecilia. */
(function(){'use strict';
var W=window.CeciliaWallet,listeners=[],lastAttempt=0;
function url(){return W.saveURL()}
function failure(code,message,permanent){var e=new Error(message);e.code=code;e.permanent=!!permanent;return e}
async function request(action,profile,state,force){
 var endpoint=url();
 var controller=new AbortController(),timer=setTimeout(function(){controller.abort()},30000);
 try{
  var options=action==='load'?{cache:'no-store',redirect:'follow',signal:controller.signal}:{method:'POST',redirect:'follow',signal:controller.signal,body:JSON.stringify({action:'save',p:profile,state:state,force:!!force})};

  if(endpoint!==url())throw failure('changed','Connection updated; reconnecting');
  if(!response.ok)throw failure('network','Save server unavailable');
  if(response.headers&&/text\/html/i.test(response.headers.get('content-type')||''))throw failure('deployment','Save server needs configuration',true);

}

})();

 cloud.state=s;if(s==='ok'){cloud.lastOk=Date.now();}
 var e=document.getElementById('hCloud');
 if(e){
  e.style.display=cloudOn()?'':'none';
  e.textContent=s==='ok'?'☁️ ✅':(s==='saving'?'☁️ …':(s==='offline'?'☁️ 💤':'☁️ ⚠️'));
 }
}
function cloudPayload(force){return JSON.stringify({action:'save',p:PROFILE,state:S,force:!!force});}
function cloudLoad(cb){
 if(!cloudOn()){cb(null,false);return;}
 cloudStatus('saving');
 CeciliaCloud.load(PROFILE).then(function(j){cloudStatus('ok');cb(j.state||null,true)}).catch(function(e){cloudStatus(e.permanent?'error':'offline');cb(null,false)});
}
function cloudRestore(){
 if(cloud.loading||!cloudOn())return;cloud.loading=true;
 cloudLoad(function(cs,reached){
  cloud.loading=false;
  if(!reached){clearTimeout(cloud.timer);cloud.timer=setTimeout(cloudRestore,20000);return}
  if(cs&&better(S,cs)===cs){
   if(cur==='game'){cloud.deferred=cs;return}
   cloudAdopt(cs);
  }
  cloud.ready=true;cloudPush(false);
 });
}
CeciliaCloud.onReconnect(function(){if(cloud.ready)cloudPush(false);else cloudRestore()});
function cloudAdopt(st){
 S=mergeState(st);saveLocal();
 if(cur==='game'){G=null;go('home');toast('Progress updated from the cloud ☁️');}
 else if(cur==='home'){renderHome();}
}
function cloudPush(force){
 if(!cloudOn()||!cloud.ready){return;}
 clearTimeout(cloud.timer);
 if(cloud.busy){cloud.pending=true;cloud.pendingForce=cloud.pendingForce||!!force;return;}
 cloud.busy=true;cloudStatus('saving');
 try{
  CeciliaCloud.save(PROFILE,S,force)
  .then(function(j){
   cloud.busy=false;
   if(j&&j.ok){cloudStatus('ok');}
   else if(j&&j.error==='older'&&j.state){cloudStatus('ok');cloudAdopt(j.state);}
   else{cloudStatus('error');}
   if(cloud.pending){var f=cloud.pendingForce;cloud.pending=false;cloud.pendingForce=false;cloudPush(f);}
  })
  ['catch'](function(){cloud.busy=false;cloudStatus('offline');cloud.timer=setTimeout(function(){cloudPush(force);},15000);});
 }catch(e){cloud.busy=false;cloudStatus('offline');}
}
function cloudSoon(){
 if(!cloudOn()||!cloud.ready){return;}
 clearTimeout(cloud.timer);
 cloud.timer=setTimeout(function(){cloudPush(false);},3000);
}
/* used when the iPad switches apps or closes the tab: fire-and-forget */
function cloudBeacon(){
 if(!cloudOn()||!cloud.ready){return;}
 clearTimeout(cloud.timer);
 try{if(navigator.sendBeacon&&navigator.sendBeacon(CLOUD_URL,new Blob([cloudPayload(false)],{type:'text/plain'}))){return;}}catch(e){}
 cloudPush(false);
}
/* pick whichever copy has more progress; on a tie, the newer one */
function better(a,b){
 if(!a){return b;}if(!b){return a;}
 var ta=Number(a.total)||0,tb=Number(b.total)||0;
 if(ta!==tb){return ta>tb?a:b;}
 return (Number(b.ts)||0)>(Number(a.ts)||0)?b:a;
}
function showLoading(on){
 var o=document.getElementById('loading');
 if(o){o.style.display=on?'flex':'none';}
}
/* runs once at start: local copies first, then the cloud */
function bootRestore(done){
 idbGet(function(j){
  var o=null;try{o=j?JSON.parse(j):null}catch(e){}
  if(o&&better(S,o)===o&&o!==S&&(Number(o.ts)||0)!==(Number(S.ts)||0))S=mergeState(o);
  done();cloudRestore();
 });
}

/* One free letter per word. Level 1: first letter, level 2: last letter, level 3: middle letter, levels 4+: random position */
function exposeIdx(n,lvl){
 if(lvl<=1){return 0;}
 if(lvl===2){return n-1;}
 if(lvl===3){return Math.floor(n/2);}
 return Math.floor(Math.random()*n);
}
function poolFor(lang,lvl){
 var l=Math.min(lvl,MAXL),p=WORDS[lang][l].slice(),i,c;
 for(i=0;i<S.custom.length;i++){c=S.custom[i];if(c.lang===lang&&c.lvl===l){p.push([c.e,c.w,c.m]);}}
 return p;
}
function pickWord(lang,avoid){
 var lvl=S.lv[lang],pool=poolFor(lang,lvl),key=lang+Math.min(lvl,MAXL),used=S.used[key]||[],c=[],i;
 for(i=0;i<pool.length;i++){if(used.indexOf(pool[i][1])<0&&S.hard.indexOf(pool[i][1])<0&&pool[i][1]!==avoid){c.push(pool[i]);}}
 if(!c.length){
  used=[];S.hard=[];
  for(i=0;i<pool.length;i++){if(pool[i][1]!==avoid){c.push(pool[i]);}}
 }
 var w=c[Math.floor(Math.random()*c.length)];
 used.push(w[1]);S.used[key]=used;save();
 return {e:w[0],w:w[1],m:w[2]};
}
function validWord(lang,w){
 var i,a=ALPHA[lang],low=[],j;
 for(j=0;j<a.length;j++){low.push(a[j].toLowerCase());}
 if(w.length<2||w.length>12){return false;}
 for(i=0;i<w.length;i++){if(low.indexOf(normCh(lang,w.charAt(i)))<0){return false;}}
 return true;
}

function keyEl(low){
 var keys=$('kb').querySelectorAll('.key'),i;
 for(i=0;i<keys.length;i++){if(normCh(G.lang,keys[i].getAttribute('data-k'))===low){return keys[i];}}
 return null;
}
function guess(ch){
 if(!G||G.over){return;}
 var low=normCh(G.lang,ch);
 if(G.guessed[low]){return;}
 var hit=G.norm.indexOf(low)>=0,k=keyEl(low);
 G.guessed[low]=hit?'good':'bad';
 if(k){k.className='key '+(hit?'good':'bad');k.disabled=true;}
 if(!hit){
  G.misses++;$('flower').classList.remove('shake');void $('flower').offsetWidth;$('flower').classList.add('shake');
  $('msg').textContent='Oops! Try another letter';
 }else{$('msg').textContent='Yes! 🎉';}
 var i,all=true;
 for(i=0;i<G.norm.length;i++){if(G.guessed[G.norm[i]]!=='good'){all=false;break;}}
 if(all){G.over=true;G.won=true;S.round=null;onWin();return;}
 if(G.misses>=LIVES){G.over=true;G.won=false;onLose();return;}
 saveRound();
 renderGame();
}

 if(!G||G.over){return;}
 if(S.coins<HINT_COST){toast('You need '+HINT_COST+' coins for a hint');return;}
 var c=[],i;
 for(i=0;i<G.norm.length;i++){if(G.guessed[G.norm[i]]!=='good'&&c.indexOf(G.norm[i])<0){c.push(G.norm[i]);}}
 if(!c.length){return;}
 if(!CeciliaWallet.spend(HINT_COST,GAME.id,'Hint',GAME.id+':hint:'+CeciliaWallet.uid(),{})){toast('Not enough shared coins');return;}S.coins=CeciliaWallet.balance();G.hints++;save();
 guess(c[Math.floor(Math.random()*c.length)]);
 renderGame();
}

 }

/* ----- move-by-move auto-save ----- */
function saveRound(){
 if(G&&G.word&&!G.over){
  S.round={lang:G.lang,e:G.word.e,w:G.word.w,m:G.word.m,g:G.guessed,mi:G.misses,h:G.hints,a:G.attempt,l:G.last,f:G.freeLetter};
 }
 save();
}
function restoreRound(){
 var r=S.round,i,k,low,keys;
 G.word={e:r.e,w:r.w,m:r.m};G.last=r.l||r.w;G.attempt=r.a||1;
 G.misses=r.mi||0;G.hints=r.h||0;G.over=false;G.won=false;G.reveal=false;
 G.guessed={};for(k in (r.g||{})){G.guessed[k]=r.g[k];}
 G.chars=G.word.w.split('');G.norm=[];
 for(i=0;i<G.chars.length;i++){G.norm.push(normCh(G.lang,G.chars[i]));}
 G.freeLetter=r.f;
 if(!G.freeLetter){G.freeLetter=G.norm[exposeIdx(G.norm.length,S.lv[G.lang])];G.guessed[G.freeLetter]='good';}
 keys=$('kb').querySelectorAll('.key');
 for(i=0;i<keys.length;i++){
  low=normCh(G.lang,keys[i].getAttribute('data-k'));
  if(G.guessed[low]){keys[i].className='key '+G.guessed[low];keys[i].disabled=true;}
  else{keys[i].className='key';keys[i].disabled=false;}
 }
 $('msg').textContent='Welcome back! 🌻';
 saveRound();
}

 }

function wrapText(ctx,text,maxW){
 var words=text.split(' '),lines=[],line='',i,t;
 for(i=0;i<words.length;i++){
  t=line?line+' '+words[i]:words[i];
  if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=words[i];}else{line=t;}
 }
 if(line){lines.push(line);}
 return lines;
}
var PORDER=['first','lv_en_1','lv_fr_1','lv_ar_1','clean1','s10','lv_en_2','lv_fr_2','lv_ar_2','page0','w25','all2','lv_en_3','lv_fr_3','lv_ar_3','page1','s25','w50','lv_en_4','lv_fr_4','lv_ar_4','page2','clean3','all3','lv_en_5','lv_fr_5','lv_ar_5','page3','w100','all4','page4','page5','master'];

 if(!FACES.length){CeciliaPerformance.loadPhotos(function(faces){FACES=faces;if(faces.length)preloadFaces()});return}
 var i;
 for(i=0;i<FACES.length;i++){(function(k){var im=new Image();im.onload=function(){FIMG[k]=im;var id;for(id in PICS){if(Math.round(Math.max(0,PORDER.indexOf(id))*(FACES.length-1)/(PORDER.length-1))===k){if(PICS[id].url)URL.revokeObjectURL(PICS[id].url);delete PICS[id];var image=document.querySelector('img[data-trophy-id="'+id+'"]');if(image){var picture=picFile(id);image.src=picture.url;var download=document.querySelector('a[data-trophy-download="'+id+'"]');if(download)download.href=picture.url}}}};im.src=FACES[k];})(i);}

function makePic(id){
 var a=achById(id),c=document.createElement('canvas'),ctx,g,i,seed,x,y,face=faceFor(id),isPage=id.indexOf('page')===0,nm=S.name||'',
  EM='"Apple Color Emoji","Noto Color Emoji","Segoe UI Emoji",sans-serif',TX='"Arial Rounded MT Bold","Trebuchet MS","Geeza Pro",Arial,sans-serif';
 c.width=1080;c.height=1080;ctx=c.getContext('2d');
 g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,a.c1);g.addColorStop(1,a.c2);
 ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);
 ctx.textAlign='center';ctx.textBaseline='middle';
 seed=hashStr(id);ctx.font='64px '+EM;ctx.globalAlpha=.55;
 var deco=['⭐','✨','🌸','🎈','🌟','🎉'];
 for(i=0;i<22;i++){
  seed=(seed*1103515245+12345)&0x7fffffff;x=seed%1000+40;
  seed=(seed*1103515245+12345)&0x7fffffff;y=seed%1000+40;
  if(x>100&&x<980&&y>80&&y<1000){x=x<540?55:1025;}
  ctx.fillText(deco[i%deco.length],x,y);
 }
 ctx.globalAlpha=1;
 ctx.shadowColor='rgba(0,0,0,.25)';ctx.shadowBlur=30;ctx.shadowOffsetY=12;
 ctx.fillStyle='#ffffff';ctx.beginPath();
 if(ctx.roundRect){ctx.roundRect(100,70,880,930,70);}else{ctx.rect(100,70,880,930);}
 ctx.fill();
 ctx.shadowColor='transparent';ctx.shadowBlur=0;ctx.shadowOffsetY=0;
 ctx.fillStyle='#5b6b88';ctx.font='bold 42px '+TX;ctx.fillText(GAME.icon+' '+GAME.title+' '+GAME.icon,540,135);
 /* avatar circle: her face (or the trophy emoji when there is no photo) */
 ctx.fillStyle=a.c2;ctx.beginPath();ctx.arc(540,360,192,0,Math.PI*2);ctx.fill();
 ctx.save();ctx.beginPath();ctx.arc(540,360,176,0,Math.PI*2);ctx.clip();
 if(face){ctx.drawImage(face,364,184,352,352);}
 else{ctx.fillStyle=a.c1;ctx.fillRect(364,184,352,352);ctx.fillStyle='#000';ctx.font='230px '+EM;ctx.fillText(a.e,540,372);}
 ctx.restore();
 if(face){ /* trophy badge */
  ctx.fillStyle='#ffffff';ctx.beginPath();ctx.arc(705,510,70,0,Math.PI*2);ctx.fill();
  ctx.strokeStyle=a.c2;ctx.lineWidth=10;ctx.stroke();
  ctx.fillStyle='#000';ctx.font='84px '+EM;ctx.fillText(a.e,705,517);
 }
 ctx.fillStyle='#1d2b4a';ctx.font='bold 68px '+TX;
 var lines=wrapText(ctx,a.t,780),ty=650;
 for(i=0;i<lines.length;i++){ctx.fillText(lines[i],540,ty+i*78);}
 var sy=ty+(lines.length-1)*78+64;
 ctx.fillStyle='#4a5a78';ctx.font='38px '+TX;ctx.fillText(a.s,540,sy);
 if(nm){
  var fs=88;ctx.font='bold '+fs+'px '+TX;
  while(ctx.measureText('★ '+nm+' ★').width>780&&fs>40){fs-=4;ctx.font='bold '+fs+'px '+TX;}
  ctx.fillStyle=a.c2;ctx.fillText('★ '+nm+' ★',540,sy+84);
 }
 if(isPage){
  var P=PAGES[parseInt(id.substring(4),10)];ctx.font='58px '+EM;ctx.fillStyle='#000';
  for(i=0;i<8;i++){ctx.fillText(P.items[i],215+i*93,948);}
 }
 if(!isPage){ctx.font='64px '+EM;ctx.fillStyle='#000';ctx.fillText('⭐ 🌟 ⭐',540,930);}
 var d=new Date(S.tro[id]||Date.now());
 ctx.fillStyle='#ffffff';ctx.font='bold 38px '+TX;
 ctx.fillText(d.getDate()+'/'+(d.getMonth()+1)+'/'+d.getFullYear(),540,1040);
 return c.toDataURL('image/png');
}
